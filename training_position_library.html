<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Positions Library</title>
    <style>
        html { min-height:100%; background:linear-gradient(180deg,#0f1c3f,#0a122b); }
        body { margin:0; min-height:100vh; font-family:Arial,sans-serif; background:linear-gradient(180deg,#0f1c3f,#0a122b); color:#fff; }
        .fullscreen-btn { position:fixed; top:10px; right:10px; z-index:1200; width:34px; height:34px; border:1px solid #3659bb; border-radius:10px; background:rgba(28,51,128,.92); color:#fff; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .page { width:min(1500px,96%); margin:16px auto 24px; }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
        .title { font-size:46px; font-weight:700; margin:0; }
        .sub { margin-top:6px; opacity:.76; font-size:16px; }
        .actions { display:flex; gap:8px; flex-wrap:wrap; }
        .btn { border:none; border-radius:10px; padding:10px 13px; background:#1c3380; border:1px solid #3659bb; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
        .btn.primary { background:#2f4fe0; }
        .btn.danger { background:#9f3434; border-color:#be5757; }
        .card { background:linear-gradient(180deg,#162b66,#0f1c3f); border:1px solid #2d488f; border-radius:22px; box-shadow:0 24px 56px rgba(0,0,0,.45); overflow:hidden; }
        .section { padding:14px; border-bottom:1px solid #27417f; }
        .section:last-child { border-bottom:none; }
        .section-title { font-size:18px; font-weight:800; margin:0 0 6px; }
        .section-sub { font-size:12px; opacity:.76; margin-bottom:10px; }
        .notice { padding:12px 14px; border-radius:14px; border:1px solid #556db2; background:rgba(20,38,89,.78); font-size:14px; line-height:1.5; margin-bottom:12px; display:none; }
        .notice.warn { border-color:#b89a35; background:rgba(94,73,10,.35); color:#ffe7a0; }
        .chips { display:flex; gap:8px; flex-wrap:wrap; }
        .chip { padding:8px 11px; border:none; border-radius:999px; background:#1c3380; color:#fff; font-size:13px; font-weight:700; cursor:pointer; border:1px solid #2f4ea0; }
        .chip.active { background:#ffd84a; color:#101420; border-color:#ffe27a; }
        .filter-group { margin-top:10px; }
        .filter-label { font-size:12px; opacity:.72; margin:0 0 7px; font-weight:700; }
        .list { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
        .item { border:1px solid #3557b7; border-radius:16px; background:rgba(12,28,72,.72); padding:10px; display:grid; gap:8px; }
        .item-top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
        .item-title { font-size:16px; font-weight:800; }
        .item-sub { font-size:12px; opacity:.76; margin-top:3px; }
        .item-meta { font-size:12px; opacity:.72; margin-top:4px; }
        .item-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
        .item-tag { border:1px solid #4864bf; background:#172f72; color:#dce5ff; border-radius:999px; padding:4px 7px; font-size:11px; font-weight:700; }
        .item-check { display:flex; align-items:center; justify-content:center; min-width:28px; }
        .item-check input { width:18px; height:18px; accent-color:#ffd84a; cursor:pointer; }
        .item-body { display:grid; gap:8px; align-items:start; }
        .item-text { font-size:12px; line-height:1.35; opacity:.9; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:49px; }
        .thumb-wrap { position:relative; width:100%; min-width:0; border-radius:0; overflow:hidden; background:#f7f7f4; aspect-ratio:1200/674; box-shadow:0 8px 18px rgba(0,0,0,.16); cursor:pointer; }
        .thumb-wrap:hover { box-shadow:0 12px 24px rgba(0,0,0,.24); }
        .thumb-stage { position:absolute; inset:0; }
        .thumb-bg, .thumb-lines, .thumb-balls { position:absolute; top:50%; left:50%; width:56.1667%; height:178.0415%; transform:translate(-50%,-50%) rotate(90deg); transform-origin:center; }
        .thumb-bg { object-fit:cover; display:block; }
        .thumb-lines, .thumb-balls { display:block; }
        .media-badge { position:absolute; right:8px; bottom:8px; z-index:2; width:22px; height:16px; border-radius:5px; background:#ff0033; box-shadow:0 2px 8px rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; }
        .media-badge svg { width:10px; height:10px; fill:#fff; display:block; }
        .empty { padding:14px; border-radius:14px; border:1px dashed rgba(255,255,255,.18); opacity:.74; }
        .youtube-modal { position:fixed; inset:0; z-index:2000; display:none; align-items:center; justify-content:center; padding:18px; box-sizing:border-box; background:rgba(4,9,26,.82); }
        .youtube-modal.visible { display:flex; }
        .youtube-panel { width:min(1500px,98vw); max-height:94vh; overflow:auto; background:linear-gradient(180deg,#162b66,#0f1c3f); border:1px solid #2d488f; border-radius:18px; box-shadow:0 28px 60px rgba(0,0,0,.5); padding:14px; display:grid; gap:12px; }
        .youtube-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .youtube-title { font-size:20px; font-weight:800; }
        .youtube-row { display:flex; gap:8px; align-items:center; }
        .youtube-edit-panel { display:none; flex-wrap:wrap; }
        .youtube-edit-panel.visible { display:flex; }
        .youtube-row input { flex:1; min-width:0; border:1px solid #3959ab; border-radius:10px; padding:10px 12px; color:#fff; background:#112659; font-size:14px; }
        .youtube-row select { border:1px solid #3959ab; border-radius:10px; padding:10px 12px; color:#fff; background:#112659; font-size:14px; font-weight:700; }
        .youtube-stage { position:relative; width:100%; aspect-ratio:16/9; border:1px solid #3557b7; border-radius:14px; background:#050b1e; overflow:hidden; }
        .youtube-player { position:absolute; inset:0; width:100%; height:100%; border:0; background:#050b1e; display:block; }
        .youtube-marker-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:3; display:none; cursor:crosshair; }
        .youtube-stage.marker-active .youtube-marker-canvas { display:block; }
        .youtube-save-row { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
        .youtube-marker-tools { display:none; gap:8px; flex-wrap:wrap; align-items:center; }
        .youtube-marker-tools.visible { display:flex; }
        .youtube-ball-picks { display:none; gap:8px; flex-wrap:wrap; }
        .youtube-ball-pick { border:1px solid #3659bb; border-radius:999px; padding:8px 11px; background:#17306f; color:#fff; font-size:13px; font-weight:800; cursor:pointer; }
        .youtube-ball-pick.active { outline:2px solid #ffd84a; }
        .youtube-ball-pick.red { background:#922b35; }
        .youtube-ball-pick.yellow { background:#8f7918; color:#111; }
        .youtube-ball-pick.white { background:#e7ecf5; color:#111; }
        .youtube-status { font-size:13px; color:#dce6ff; opacity:.82; }
        @media (max-width: 980px) { .list { grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); } .item-text { -webkit-line-clamp:4; } }
    </style>
</head>
<body>
    <button id="fullscreenBtn" class="fullscreen-btn" type="button" onclick="toggleFullscreen()">⛶</button>
    <div class="page">
        <div class="topbar">
            <div>
                <h1 class="title">Positions Library</h1>
            </div>
            <div class="actions">
                <button class="btn primary" id="newPositionBtn" type="button" onclick="window.location.href='training_position_library_editor.html'">Neu</button>
                <button class="btn primary" id="newYoutubePositionBtn" type="button" onclick="openYoutubeCapture()">Neu von YouTube Video</button>
                <button class="btn danger" id="deleteSelectedBtn" type="button" onclick="deleteSelectedPositions()" style="display:none;">Auswahl löschen</button>
                <button class="btn" type="button" onclick="window.location.href='training.html'">Zurück</button>
            </div>
        </div>

        <div class="card">
            <div class="section">
                <div id="noticeBox" class="notice"></div>
                <div class="filter-group">
                    <div class="filter-label">Disziplin</div>
                    <div class="chips" id="filterButtons"></div>
                </div>
                <div class="filter-group" id="tagFilterGroup" style="display:none;">
                    <div class="filter-label">Tags</div>
                    <div class="chips" id="tagFilterButtons"></div>
                </div>
            </div>
            <div class="section">
                <div id="libraryList" class="list"></div>
            </div>
        </div>
    </div>
    <div class="youtube-modal" id="youtubeCaptureModal" aria-hidden="true">
        <div class="youtube-panel">
            <div class="youtube-head">
                <div class="youtube-title">Positionen aus YouTube Video</div>
                <button class="btn" type="button" onclick="closeYoutubeCapture()">Schließen</button>
            </div>
            <div class="youtube-row">
                <input id="youtubeCaptureInput" type="url" placeholder="YouTube-Link einfügen">
                <button class="btn secondary" type="button" onclick="loadYoutubeCaptureVideo()">Video laden</button>
            </div>
            <div class="youtube-row youtube-edit-panel" id="youtubeEditPanel">
                <label class="filter-label" for="youtubeDisciplineSelect" style="margin:0; min-width:78px;">Disziplin</label>
                <select id="youtubeDisciplineSelect"></select>
                <input id="youtubePositionTitleInput" type="text" maxlength="120" placeholder="Positionsname">
                <input id="youtubeTimestampInput" type="text" readonly value="Zeit: -" style="max-width:120px;">
            </div>
            <div class="youtube-stage" id="youtubeCaptureStage">
                <iframe class="youtube-player" id="youtubeCapturePlayer" title="YouTube Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                <canvas class="youtube-marker-canvas" id="youtubeMarkerCanvas"></canvas>
            </div>
            <div class="youtube-marker-tools" id="youtubeMarkerTools">
                <button class="btn secondary" id="youtubeMarkerCornersBtn" type="button" onclick="setYoutubeMarkerStep('corners')">1. Tisch ausrichten</button>
                <button class="btn secondary" id="youtubeMarkerBallsBtn" type="button" onclick="setYoutubeMarkerStep('balls')">2. Bälle setzen</button>
                <button class="btn secondary" type="button" onclick="resetYoutubeMarkers()">Marker zurücksetzen</button>
                <button class="btn secondary" id="saveYoutubeCalibrationBtn" type="button" onclick="saveYoutubeCalibration()">Kalibrierung speichern</button>
                <button class="btn primary" type="button" onclick="saveYoutubeCapturePosition(true)">Pos speichern</button>
                <button class="btn" type="button" onclick="closeYoutubeMarkers()">Marker schließen</button>
                <div class="youtube-ball-picks" id="youtubeMarkerBallPicks">
                    <button class="youtube-ball-pick red active" id="youtubeMarkerBallRed" type="button" onclick="setYoutubeMarkerActiveBall(0)">Rot</button>
                    <button class="youtube-ball-pick yellow" id="youtubeMarkerBallYellow" type="button" onclick="setYoutubeMarkerActiveBall(1)">Gelb</button>
                    <button class="youtube-ball-pick white" id="youtubeMarkerBallWhite" type="button" onclick="setYoutubeMarkerActiveBall(2)">Weiß</button>
                </div>
            </div>
            <div class="youtube-save-row">
                <div class="youtube-status" id="youtubeCaptureStatus">Video laden, pausieren, dann Position übernehmen.</div>
                <button class="btn primary" id="saveYoutubeCaptureBtn" type="button" onclick="startYoutubePositionCapture()" disabled>Position übernehmen</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/position_library_access.js"></script>
    <script src="js/user_menu.js"></script>
    <script>
        const disciplines = ["Alle", "Freie Partie", "Cadre 35/2", "Cadre 52/2", "Cadre 47/2", "Cadre 47/1", "Cadre 71/2", "Einband", "Dreiband"];
        const tableTemplates = {
            "Freie Partie": "assets/discipline-mb-libre.png",
            "Cadre 35/2": "assets/discipline-tb-35.png",
            "Cadre 52/2": "assets/discipline-tb-52.png",
            "Cadre 47/2": "assets/discipline-mb-47.png",
            "Cadre 47/1": "assets/discipline-mb-47.png",
            "Cadre 71/2": "assets/discipline-mb-71.png",
            "Einband": "assets/discipline-mb-bande.png",
            "Dreiband": "assets/discipline-mb-bande.png"
        };
        const defaultLayout = {
            red: { x: 236, y: 166 },
            yellow: { x: 259, y: 214 },
            white: { x: 232, y: 201 }
        };
        const bounds = { minX: 70, maxX: 605, minY: 58, maxY: 1143 };
        const POSITION_LIBRARY_NAV_KEY = "positionLibraryNavigationContext:v1";
        const PHOTO_IMPORT_CALIBRATION_KEY = "positionLibraryPhotoImportCalibration:v1";
        const photoImportTableCorners = [
            { x: bounds.minX, y: bounds.minY },
            { x: bounds.maxX, y: bounds.minY },
            { x: bounds.maxX, y: bounds.maxY },
            { x: bounds.minX, y: bounds.maxY }
        ];
        const TABLE_RENDER_SPECS = {
            MB: { radius: 11.0, whiteStrokeWidth: 1.35 },
            TB: { radius: 14.9, whiteStrokeWidth: 1.86 }
        };
        let currentUser = null;
        let activeFilter = "Alle";
        let activeTagFilter = "Alle";
        let libraryItems = [];
        let selectedIds = new Set();
        let positionLibraryAccessMode = "edit";
        let youtubeCaptureUrl = "";
        let youtubeCaptureApiPromise = null;
        let youtubeCapturePlayer = null;
        let youtubeCapturePlayerSrc = "";
        let youtubeCapturePlayerInitPromise = null;
        let youtubeMarkerActive = false;
        let youtubeMarkerStep = "corners";
        let youtubeMarkerCorners = [];
        let youtubeMarkerBalls = [];
        let youtubeMarkerActiveBall = 0;
        let youtubeMarkerDrag = null;
        let youtubeMarkerOrientation = "up";
        let youtubeMarkerLayout = null;
        let youtubeCapturePendingSeconds = null;
        let youtubeCapturePendingTitle = "";

        function setNotice(text, type) {
            const box = document.getElementById("noticeBox");
            box.style.display = text ? "block" : "none";
            box.className = "notice" + (type ? " " + type : "");
            box.innerText = text || "";
        }
        function updateFullscreenButton() {
            const btn = document.getElementById("fullscreenBtn");
            if (!btn) return;
            btn.innerText = document.fullscreenElement ? "×" : "⛶";
        }
        async function toggleFullscreen() {
            try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen();
            } catch (_) {}
            updateFullscreenButton();
        }
        function cloneLayout(layout) {
            return layout && layout.red ? {
                red: { ...layout.red },
                yellow: { ...layout.yellow },
                white: { ...layout.white }
            } : {
                red: { ...defaultLayout.red },
                yellow: { ...defaultLayout.yellow },
                white: { ...defaultLayout.white }
            };
        }
        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }
        function getCanvasPoint(canvas, event) {
            if (!canvas) return null;
            const rect = canvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return null;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (event.clientX - rect.left) * scaleX,
                y: (event.clientY - rect.top) * scaleY
            };
        }
        function getCalibration() {
            try {
                const parsed = JSON.parse(localStorage.getItem(PHOTO_IMPORT_CALIBRATION_KEY) || "null");
                if (!parsed || !Array.isArray(parsed.corners) || parsed.corners.length !== 4) return null;
                return parsed;
            } catch (_) {
                return null;
            }
        }
        function getTargetCorners(orientation) {
            const base = photoImportTableCorners;
            if (orientation === "right") return [base[1], base[2], base[3], base[0]];
            if (orientation === "down") return [base[2], base[3], base[0], base[1]];
            if (orientation === "left") return [base[3], base[0], base[1], base[2]];
            return base;
        }
        function getTemplateForDiscipline(discipline) { return tableTemplates[discipline] || "assets/discipline-mb-47.png"; }
        function parseYouTubeTime(value) {
            const raw = String(value || "").trim();
            if (!raw) return 0;
            if (/^\d+$/.test(raw)) return Number(raw);
            if (/^\d+:\d{1,2}(:\d{1,2})?$/.test(raw)) {
                return raw.split(":").map(Number).reduce((total, part) => (total * 60) + part, 0);
            }
            const hours = Number((raw.match(/(\d+)\s*h/) || [])[1] || 0);
            const minutes = Number((raw.match(/(\d+)\s*m/) || [])[1] || 0);
            const seconds = Number((raw.match(/(\d+)\s*s/) || [])[1] || 0);
            return (hours * 3600) + (minutes * 60) + seconds;
        }
        function parseYouTubeUrl(value) {
            const raw = String(value || "").trim();
            if (!raw) return null;
            let url = null;
            try {
                url = new URL(raw);
            } catch (_) {
                try { url = new URL("https://" + raw); } catch (_) { return null; }
            }
            const host = url.hostname.replace(/^www\./, "");
            let id = "";
            if (host === "youtu.be") id = url.pathname.split("/").filter(Boolean)[0] || "";
            if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
                if (url.pathname === "/watch") id = url.searchParams.get("v") || "";
                else if (url.pathname.startsWith("/embed/") || url.pathname.startsWith("/shorts/")) id = url.pathname.split("/").filter(Boolean)[1] || "";
            }
            id = String(id || "").replace(/[^\w-]/g, "").slice(0, 20);
            if (!id) return null;
            const hashParams = new URLSearchParams(url.hash.replace(/^#/, ""));
            const start = parseYouTubeTime(url.searchParams.get("t") || url.searchParams.get("start") || hashParams.get("t") || hashParams.get("start") || "");
            return { id, start };
        }
        function formatVideoTimestamp(seconds) {
            const total = Math.max(0, Math.floor(Number(seconds) || 0));
            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const secs = total % 60;
            return hours
                ? `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`
                : `${minutes}:${String(secs).padStart(2, "0")}`;
        }
        function buildYouTubeWatchUrl(id, seconds) {
            const safeSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
            return "https://www.youtube.com/watch?v=" + encodeURIComponent(id) + (safeSeconds ? "&t=" + safeSeconds + "s" : "");
        }
        function buildYouTubeEmbedUrl(parsed) {
            if (!parsed?.id) return "";
            const params = new URLSearchParams({
                enablejsapi: "1",
                origin: window.location.origin
            });
            if (parsed.start) params.set("start", String(parsed.start));
            return "https://www.youtube.com/embed/" + encodeURIComponent(parsed.id) + "?" + params.toString();
        }
        function loadYouTubeIframeApi() {
            if (window.YT?.Player) return Promise.resolve(window.YT);
            if (youtubeCaptureApiPromise) return youtubeCaptureApiPromise;
            youtubeCaptureApiPromise = new Promise((resolve) => {
                const previousCallback = window.onYouTubeIframeAPIReady;
                window.onYouTubeIframeAPIReady = () => {
                    if (typeof previousCallback === "function") previousCallback();
                    resolve(window.YT);
                };
                if (!document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
                    const script = document.createElement("script");
                    script.src = "https://www.youtube.com/iframe_api";
                    document.head.appendChild(script);
                }
            });
            return youtubeCaptureApiPromise;
        }
        function ensureYoutubeCapturePlayer() {
            const iframe = document.getElementById("youtubeCapturePlayer");
            const parsed = parseYouTubeUrl(youtubeCaptureUrl);
            const embedUrl = buildYouTubeEmbedUrl(parsed);
            if (!iframe || !embedUrl) return Promise.resolve(null);
            if (youtubeCapturePlayer && youtubeCapturePlayerSrc === embedUrl) return Promise.resolve(youtubeCapturePlayer);
            if (youtubeCapturePlayerInitPromise && youtubeCapturePlayerSrc === embedUrl) return youtubeCapturePlayerInitPromise;
            youtubeCapturePlayerSrc = embedUrl;
            youtubeCapturePlayerInitPromise = loadYouTubeIframeApi().then((YT) => {
                if (!YT?.Player) return null;
                youtubeCapturePlayer = new YT.Player(iframe, {});
                return youtubeCapturePlayer;
            }).catch(() => null).finally(() => {
                youtubeCapturePlayerInitPromise = null;
            });
            return youtubeCapturePlayerInitPromise;
        }
        async function getYoutubeCaptureTime() {
            const fallback = parseYouTubeUrl(youtubeCaptureUrl)?.start || 0;
            const player = await ensureYoutubeCapturePlayer();
            if (!player || typeof player.getCurrentTime !== "function") return fallback;
            try {
                const current = Number(player.getCurrentTime());
                return Number.isFinite(current) && current >= 0 ? current : fallback;
            } catch (_) {
                return fallback;
            }
        }
        function solveLinearSystem(matrix, values) {
            const n = values.length;
            const a = matrix.map((row, rowIndex) => row.concat(values[rowIndex]));
            for (let i = 0; i < n; i += 1) {
                let maxRow = i;
                for (let j = i + 1; j < n; j += 1) {
                    if (Math.abs(a[j][i]) > Math.abs(a[maxRow][i])) maxRow = j;
                }
                if (Math.abs(a[maxRow][i]) < 1e-9) return null;
                if (maxRow !== i) {
                    const tmp = a[i];
                    a[i] = a[maxRow];
                    a[maxRow] = tmp;
                }
                const pivot = a[i][i];
                for (let j = i; j <= n; j += 1) a[i][j] /= pivot;
                for (let j = 0; j < n; j += 1) {
                    if (j === i) continue;
                    const factor = a[j][i];
                    for (let k = i; k <= n; k += 1) a[j][k] -= factor * a[i][k];
                }
            }
            return a.map((row) => row[n]);
        }
        function computeHomography(srcPoints, dstPoints) {
            const matrix = [];
            const values = [];
            for (let i = 0; i < 4; i += 1) {
                const src = srcPoints[i];
                const dst = dstPoints[i];
                matrix.push([src.x, src.y, 1, 0, 0, 0, -src.x * dst.x, -src.y * dst.x]);
                values.push(dst.x);
                matrix.push([0, 0, 0, src.x, src.y, 1, -src.x * dst.y, -src.y * dst.y]);
                values.push(dst.y);
            }
            const solution = solveLinearSystem(matrix, values);
            if (!solution) return null;
            return [
                [solution[0], solution[1], solution[2]],
                [solution[3], solution[4], solution[5]],
                [solution[6], solution[7], 1]
            ];
        }
        function projectPoint(matrix, point) {
            const denominator = (matrix[2][0] * point.x) + (matrix[2][1] * point.y) + matrix[2][2];
            if (!denominator) return null;
            return {
                x: (((matrix[0][0] * point.x) + (matrix[0][1] * point.y) + matrix[0][2]) / denominator),
                y: (((matrix[1][0] * point.x) + (matrix[1][1] * point.y) + matrix[1][2]) / denominator)
            };
        }
        function setFilter(value) {
            activeFilter = value || "Alle";
            document.querySelectorAll("#filterButtons .chip").forEach((btn) => btn.classList.toggle("active", btn.dataset.value === activeFilter));
            renderLibrary();
        }
        function normalizeTag(value) {
            return String(value || "").trim().replace(/[<>"']/g, "").replace(/\s+/g, " ").slice(0, 40);
        }
        function normalizeTags(value) {
            const source = Array.isArray(value) ? value : [];
            const seen = new Set();
            return source
                .map(normalizeTag)
                .filter(Boolean)

                ctx.lineTo(pt.x - gap, pt.y);
                ctx.moveTo(pt.x + gap, pt.y);
                ctx.lineTo(pt.x + arm, pt.y);
                ctx.moveTo(pt.x, pt.y - arm);
                ctx.lineTo(pt.x, pt.y - gap);
                ctx.moveTo(pt.x, pt.y + gap);
                ctx.lineTo(pt.x, pt.y + arm);
            };
            ctx.strokeStyle = "#10192f";
            ctx.lineWidth = highlighted ? 5 : 4;
            drawPath();
            ctx.stroke();
            ctx.strokeStyle = highlighted ? "#ffd84a" : "#9fdcff";
            ctx.lineWidth = highlighted ? 3 : 2.5;
            drawPath();
            ctx.stroke();
            ctx.fillStyle = highlighted ? "#ffd84a" : "#9fdcff";

                    y: clamp(Number(point.y || 0) * canvas.height, 0, canvas.height)

                youtubeMarkerCorners = [

                    { x: canvas.width - marginX, y: marginY },
                    { x: canvas.width - marginX, y: canvas.height - marginY },
                    { x: marginX, y: canvas.height - marginY }

            if (!discipline) {
                alert("Bitte eine Disziplin auswählen.");
                document.getElementById("youtubeDisciplineSelect")?.focus();
                setYoutubeCaptureStatus("Disziplin fehlt. Bitte auswählen und erneut speichern.");
                return;
            }
            const ownProfile = typeof getOwnProfile === "function" ? await getOwnProfile(currentUser.id) : null;
            const creatorName = (ownProfile?.full_name || (typeof getDisplayName === "function" ? getDisplayName(currentUser) : "") || currentUser.email || currentUser.id || "").trim();
            const markerLayout = getYoutubeMarkerLayout();
            if (useMarkers && !markerLayout) {
                alert("Bitte zuerst Tisch und Bälle markieren.");
                return;
            }
            const layout = cloneLayout(markerLayout || defaultLayout);
            const page = {
                ball_layout: cloneLayout(layout),
                line_paths: [],
                page_description: "",
                is_followup: false,
                video_timestamp: seconds
            };
            const payload = {
                user_id: currentUser.id,
                created_by_name: creatorName,
                title,
                discipline,
                description: `Aus YouTube-Video bei ${formatVideoTimestamp(seconds)}`,
                reference_photo: "",
                tags: [],
                video_path: "",
                video_name: "YouTube",
                video_size: 0,
                video_type: "",
                video_provider: "youtube",
                video_url: buildYouTubeWatchUrl(parsed.id, seconds),
                ball_layout: cloneLayout(layout),
                line_paths: [],
                position_pages: [page]
            };
            const { data, error } = await supabaseClient
                .from("training_position_library")
                .insert(payload)
                .select("id,video_provider,video_url,ball_layout,position_pages")
                .single();
            if (error) {
                alert("Position konnte nicht gespeichert werden: " + error.message);
                return;
            }
            if (data?.video_provider !== "youtube" || !data?.video_url || !data?.ball_layout?.red) {
                alert("Position wurde gespeichert, aber Video-Link oder Ballgrafik wurden nicht vollständig zurückgegeben. Bitte SQL aus sql/training_position_library.sql in Supabase prüfen.");
                return;
            }
            closeYoutubeMarkers();
            setYoutubeCaptureStatus(`Gespeichert: ${title} (${discipline}, ${formatVideoTimestamp(seconds)})`);
            if (youtubeCapturePlayer && typeof youtubeCapturePlayer.playVideo === "function") {
                try { youtubeCapturePlayer.playVideo(); } catch (_) {}
            }
            await loadLibrary();
        }
        async function init() {
            currentUser = await requireAuth();
            if (!currentUser) return;
            positionLibraryAccessMode = await getPositionLibraryAccess(currentUser);
            if (!isPositionLibraryVisible(positionLibraryAccessMode)) {
                window.location.href = "training.html";
                return;
            }
            document.getElementById("newPositionBtn").style.display = isPositionLibraryEditable(positionLibraryAccessMode) ? "inline-flex" : "none";
            document.getElementById("newYoutubePositionBtn").style.display = isPositionLibraryEditable(positionLibraryAccessMode) ? "inline-flex" : "none";
            updateDeleteSelectedUi();
            buildFilterButtons();
            buildYoutubeDisciplineSelect();
            await loadLibrary();
        }
        document.addEventListener("fullscreenchange", updateFullscreenButton);
        window.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && document.getElementById("youtubeCaptureModal")?.classList.contains("visible")) {
                event.preventDefault();
                if (youtubeMarkerActive) closeYoutubeMarkers();
                else closeYoutubeCapture();
            }
        });
        window.addEventListener("resize", drawYoutubeMarkers);
        window.addEventListener("pointerup", stopYoutubeMarkerDrag);
        window.addEventListener("pointercancel", stopYoutubeMarkerDrag);
        document.getElementById("youtubeCaptureInput").addEventListener("keydown", (event) => {
            if (event.key !== "Enter") return;
            event.preventDefault();
            loadYoutubeCaptureVideo();
        });
        document.getElementById("youtubeMarkerCanvas").addEventListener("pointerdown", handleYoutubeMarkerPointerDown);
        document.getElementById("youtubeMarkerCanvas").addEventListener("pointermove", handleYoutubeMarkerPointerMove);
        document.getElementById("youtubeMarkerCanvas").addEventListener("pointerup", stopYoutubeMarkerDrag);
        document.getElementById("youtubeMarkerCanvas").addEventListener("pointercancel", stopYoutubeMarkerDrag);
        updateFullscreenButton();
        init();
    </script>
</body>
</html>
