<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Remote Match Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --overlay-width: 1020px;
            --overlay-height: 52px;
            --blue-deep: rgba(15, 28, 63, 0.94);
            --blue-mid: rgba(28, 51, 128, 0.96);
            --blue-panel: rgba(18, 34, 82, 0.96);
            --yellow: rgba(255, 216, 74, 0.98);
        }
        html, body {
            margin: 0;
            width: var(--overlay-width);
            height: var(--overlay-height);
            overflow: hidden;
            background: rgba(0, 0, 0, 0) !important;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        body { visibility: hidden; }
        body.stream-ready { visibility: visible; }
        .canvas {
            position: fixed;
            inset: 0;
            width: var(--overlay-width);
            height: var(--overlay-height);
            pointer-events: none;
            background: rgba(0, 0, 0, 0);
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 92px minmax(0, 1fr);
            gap: 6px;
            align-items: stretch;
        }
        .card {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 0;
        }
        .player-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 88px;
            background: linear-gradient(180deg, var(--blue-panel), var(--blue-deep));
        }
        .player-card.player-two { grid-template-columns: 88px minmax(0, 1fr); }
        .player-main {
            display: grid;
            align-content: center;
            justify-items: center;
            gap: 1px;
            min-width: 0;
            padding: 3px 12px;
            text-align: center;
        }
        .player-name {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
            font-size: clamp(18px, 1.2vw, 28px);
            font-weight: 800;
            line-height: 1;
        }
        .player-two .player-name { color: #ffd84a; }
        .player-sub {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgba(255, 255, 255, 0.64);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            line-height: 1;
        }
        .score-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(49, 74, 173, 0.96), var(--blue-mid));
            color: #ffffff;
            font-size: clamp(26px, 1.9vw, 40px);
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }
        .status-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(16, 28, 70, 0.98), rgba(10, 20, 55, 0.98));
            color: #ffffff;
            text-align: center;
        }
        .status-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.56);
        }
        .status-value {
            margin-top: 1px;
            font-size: clamp(18px, 1.3vw, 27px);
            font-weight: 900;
            line-height: 1;
        }
        .position-toast {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            min-width: 340px;
            max-width: 760px;
            padding: 9px 20px 10px;
            border-radius: 18px;
            background: rgba(255, 216, 74, 0.98);
            color: #101420;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
            opacity: 0;
            transition: opacity 180ms ease;
        }
        .position-toast.visible { opacity: 1; }
        .error-box {
            position: fixed;
            left: 50%;
            bottom: 26px;
            transform: translateX(-50%);
            width: min(720px, calc(100vw - 48px));
            padding: 18px 20px;
            border-radius: 20px;
            background: rgba(35, 10, 14, 0.92);
            border: 1px solid rgba(255, 108, 108, 0.35);
            color: #fff;
            box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
            font-size: 18px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="canvas">
        <div id="overlay" class="overlay hidden">
            <section class="card player-card player-one">
                <div class="player-main">
                    <div id="hostName" class="player-name">Spieler 1</div>
                    <div id="hostSub" class="player-sub">Disziplin · Aufnahmen</div>
                </div>
                <div id="hostScore" class="score-box">0</div>
            </section>
            <section class="card status-card">
                <div class="status-label">Remote</div>
                <div id="targetValue" class="status-value">0</div>
            </section>
            <section class="card player-card player-two">
                <div id="guestScore" class="score-box">0</div>
                <div class="player-main">
                    <div id="guestName" class="player-name">Spieler 2</div>
                    <div id="guestSub" class="player-sub">Disziplin · Aufnahmen</div>
                </div>
            </section>
            <div id="positionToast" class="position-toast"></div>
        </div>
    </div>
    <div id="errorBox" class="error-box hidden"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get("session") || "";
        const streamToken = urlParams.get("token") || "";
        let previousSession = null;
        let pollTimer = null;
        let toastTimer = null;

        function setText(id, value) {
            const el = document.getElementById(id);
            if (el) el.textContent = value;
        }

        function showError(message) {
            const errorBox = document.getElementById("errorBox");
            errorBox.textContent = message;
            errorBox.classList.remove("hidden");
            document.getElementById("overlay").classList.add("hidden");
            document.body.classList.add("stream-ready");
        }

        function getPositionCount(session) {
            return Array.isArray(session?.challenge_positions)
                ? session.challenge_positions.filter((item) => item?.red && item?.yellow && item?.white).length
                : 0;
        }

        function normalizePositionIndex(session, rawIndex) {
            const count = getPositionCount(session);
            if (!count) return Number(rawIndex || 1) || 1;
            const value = Number(rawIndex || 1);
            return !Number.isFinite(value) || value < 1 ? 1 : ((value - 1) % count) + 1;
        }

        function showPositionToast(text) {
            const toast = document.getElementById("positionToast");
            toast.textContent = text;
            toast.classList.add("visible");
            if (toastTimer) window.clearTimeout(toastTimer);
            toastTimer = window.setTimeout(() => {
                toast.classList.remove("visible");
                toastTimer = null;
            }, 5000);
        }

        function maybeShowPositionChange(next) {
            if (!previousSession) return;
            const changed = [];
            const hostPrev = normalizePositionIndex(previousSession, previousSession.host_position_index);
            const hostNext = normalizePositionIndex(next, next.host_position_index);
            const guestPrev = normalizePositionIndex(previousSession, previousSession.guest_position_index);
            const guestNext = normalizePositionIndex(next, next.guest_position_index);
            if (hostPrev !== hostNext) changed.push(`${next.host_name || "Spieler 1"}: Position ${hostNext}`);
            if (guestPrev !== guestNext) changed.push(`${next.guest_name || "Spieler 2"}: Position ${guestNext}`);
            if (changed.length) showPositionToast("Neue Position · " + changed.join(" · "));
        }

        function render(session) {
            maybeShowPositionChange(session);
            setText("hostName", session.host_name || "Spieler 1");
            setText("guestName", session.guest_name || "Spieler 2");
            setText("hostSub", `${session.host_discipline || "-"} · Aufn. ${session.host_innings || 0}`);
            setText("guestSub", `${session.guest_discipline || session.host_discipline || "-"} · Aufn. ${session.guest_innings || 0}`);
            setText("hostScore", String(session.host_score || 0));
            setText("guestScore", String(session.guest_score || 0));
            setText("targetValue", String(session.target_points || 0));
            document.getElementById("overlay").classList.remove("hidden");
            document.body.classList.add("stream-ready");
            previousSession = session;
        }

        async function fetchRemoteSession() {
            const response = await fetch("https://kstqhcaazuuxchqtnyfc.supabase.co/functions/v1/get-stream-remote-match", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session: sessionId, token: streamToken })
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || !payload?.session) {
                const parts = [payload?.error, payload?.message, payload?.details, payload?.hint, payload?.code].filter(Boolean);
                throw new Error(parts.join(" | ") || ("HTTP " + response.status));
            }
            return payload.session;
        }

        async function refresh() {
            try {
                render(await fetchRemoteSession());
            } catch (error) {
                console.warn("Remote-Overlay konnte nicht aktualisiert werden:", error);
            }
        }

        async function init() {
            if (!sessionId || !streamToken) {
                showError("Remote-Stream-Link unvollständig.");
                return;
            }
            render(await fetchRemoteSession());
            pollTimer = window.setInterval(refresh, 800);
        }

        window.addEventListener("beforeunload", () => {
            if (pollTimer) window.clearInterval(pollTimer);
            if (toastTimer) window.clearTimeout(toastTimer);
        });

        init().catch((error) => {
            showError("Remote-Overlay konnte nicht geladen werden. " + String(error?.message || error));
        });
    </script>
</body>
</html>
