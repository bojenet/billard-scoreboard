<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Userverwaltung</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #0f1c3f, #0a122b);
      color: white;
    }

    .page {
      width: min(1320px, 96vw);
      margin: 34px auto 30px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 44px;
      text-align: center;
    }

    .card {
      background: linear-gradient(180deg, #162b66, #0f1c3f);
      border: 1px solid #2d488f;
      border-radius: 20px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.45);
      overflow-x: auto;
      overflow-y: hidden;
      margin-bottom: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid #27417f;
      padding: 12px 14px;
      text-align: left;
      font-size: 16px;
      vertical-align: middle;
    }

    th {
      background: #12255a;
      font-size: 14px;
      letter-spacing: 0.4px;
      opacity: 0.9;
    }

    tr:last-child td {
      border-bottom: none;
    }

    #usersTable {
      min-width: 1120px;
      table-layout: fixed;
    }

    #usersTable th:nth-child(1),
    #usersTable td:nth-child(1) {
      width: 260px;
    }

    #usersTable th:nth-child(2),
    #usersTable td:nth-child(2) {
      width: 150px;
    }

    #usersTable th:nth-child(3),
    #usersTable td:nth-child(3) {
      width: 125px;
    }

    #usersTable th:nth-child(4),
    #usersTable td:nth-child(4) {
      width: 170px;
    }

    #usersTable th:nth-child(5),
    #usersTable td:nth-child(5) {
      width: 150px;
    }

    #usersTable th:nth-child(6),
    #usersTable td:nth-child(6) {
      width: 150px;
    }

    #usersTable th:nth-child(7),
    #usersTable td:nth-child(7) {
      width: 150px;
    }

    .muted {
      opacity: 0.72;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #3659bb;
      border-radius: 9px;
      background: #1c3380;
      font-size: 14px;
      font-weight: 700;
      color: #eef3ff;
    }

    .section-title {
      margin: 22px 0 10px;
      font-size: 24px;
      font-weight: 800;
    }

    select {
      background: #1c3380;
      color: white;
      border: 1px solid #3659bb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: 600;
    }

    .save-btn {
      border: none;
      border-radius: 9px;
      background: #2f4fe0;
      color: white;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .secondary-btn {
      background: #1c3380;
      border: 1px solid #3659bb;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      background: #1c3380;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .msg {
      font-size: 14px;
      opacity: 0.85;
      min-height: 20px;
    }

    .msg.ok { color: #b6f5c4; }
    .msg.err { color: #ffb6b6; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 10, 25, 0.72);
      z-index: 20;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(720px, 96vw);
      max-height: 92vh;
      overflow: auto;
      background: linear-gradient(180deg, #162b66, #0f1c3f);
      border: 1px solid #3659bb;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      padding: 22px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .modal-title {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      font-size: 13px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.76);
    }

    .form-field input {
      min-height: 42px;
      border: 1px solid #3659bb;
      border-radius: 9px;
      background: #0f2153;
      color: white;
      font-size: 16px;
      padding: 0 12px;
    }

    .form-field select {
      min-height: 44px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    @media (max-width: 720px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Userverwaltung</h1>
    <div class="toolbar">
      <button class="btn" type="button" onclick="openUserModal()">User erstellen</button>
    </div>
    <div class="card">
      <table id="usersTable">
        <tr>
          <th>E-Mail</th>
          <th>Name</th>
          <th>Rolle</th>
          <th>Positions Library</th>
          <th>Training</th>
          <th>Turnier</th>
          <th>Letzter Login</th>
          <th>Aktion</th>
        </tr>
      </table>
    </div>

    <h2 class="section-title">Letzte Logins</h2>
    <div class="card">
      <table id="loginEventsTable">
        <tr>
          <th>Zeit</th>
          <th>E-Mail</th>
          <th>Browser</th>
        </tr>
      </table>
    </div>

    <div class="actions">
      <button class="btn" onclick="window.location.href='index.html'">Zurück</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <div id="userModalBackdrop" class="modal-backdrop" onclick="closeUserModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="userModalTitle" class="modal-title">User erstellen</h2>
        <button class="save-btn secondary-btn" type="button" onclick="closeUserModal()">Schließen</button>
      </div>
      <div class="form-grid">
        <input id="editUserId" type="hidden" />
        <div class="form-field full">
          <label for="editEmail">E-Mail</label>
          <input id="editEmail" type="email" autocomplete="off" />
        </div>
        <div class="form-field">
          <label for="editFirstName">Vorname</label>
          <input id="editFirstName" type="text" autocomplete="off" />
        </div>
        <div class="form-field">
          <label for="editLastName">Nachname</label>
          <input id="editLastName" type="text" autocomplete="off" />
        </div>
        <div class="form-field full">
          <label for="editPassword">Passwort</label>
          <input id="editPassword" type="password" autocomplete="new-password" placeholder="Bei bestehenden Usern leer lassen, wenn unverändert" />
        </div>
        <div class="form-field">
          <label for="editRole">Rolle</label>
          <select id="editRole">
            <option value="member">member</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <div class="form-field">
          <label for="editPositionLibraryAccess">Positions Library</label>
          <select id="editPositionLibraryAccess">
            <option value="hidden">ausblenden</option>
            <option value="read">lesen</option>
            <option value="edit">editieren</option>
          </select>
        </div>
        <div class="form-field">
          <label for="editTrainingAccess">Training</label>
          <select id="editTrainingAccess">
            <option value="hidden">ausblenden</option>
            <option value="read">lesen</option>
            <option value="edit">editieren</option>
          </select>
        </div>
        <div class="form-field">
          <label for="editTournamentAccess">Turnier</label>
          <select id="editTournamentAccess">
            <option value="hidden">ausblenden</option>
            <option value="read">lesen</option>
            <option value="edit">editieren</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="save-btn secondary-btn" type="button" onclick="closeUserModal()">Abbrechen</button>
        <button id="saveUserBtn" class="save-btn" type="button" onclick="saveUser()">Speichern</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/position_library_access.js"></script>
  <script src="js/training_access.js"></script>
  <script src="js/tournament_access.js"></script>
  <script src="js/user_menu.js"></script>
  <script>
    let userRows = [];

    function setMsg(text, type) {
      const el = document.getElementById("msg");
      el.className = "msg " + (type || "");
      el.innerText = text || "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDateTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "-";
      return date.toLocaleString("de-DE", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function summarizeUserAgent(value) {
      const ua = String(value || "");
      if (!ua) return "-";
      const browser = ua.includes("Firefox/") ? "Firefox" :
        ua.includes("Edg/") ? "Edge" :
        ua.includes("Chrome/") ? "Chrome" :
        ua.includes("Safari/") ? "Safari" : "Browser";
      const platform = ua.includes("iPhone") ? "iPhone" :
        ua.includes("iPad") ? "iPad" :
        ua.includes("Mac OS X") ? "macOS" :
        ua.includes("Windows") ? "Windows" :
        ua.includes("Android") ? "Android" : "";
      return [browser, platform].filter(Boolean).join(" / ");
    }

    function accessLabel(value) {
      const normalized = String(value || "");
      if (normalized === "hidden") return "ausblenden";
      if (normalized === "read") return "lesen";
      return "editieren";
    }

    function getUserDisplayName(profile) {
      return profile?.full_name || [profile?.first_name, profile?.last_name].filter(Boolean).join(" ") || "-";
    }

    function setModalValue(id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value || "";
    }

    function openUserModal(userId = "") {
      const existing = userRows.find((user) => String(user.id) === String(userId));
      document.getElementById("userModalTitle").innerText = existing ? "User bearbeiten" : "User erstellen";
      setModalValue("editUserId", existing?.id || "");
      setModalValue("editEmail", existing?.email || "");
      setModalValue("editFirstName", existing?.first_name || "");
      setModalValue("editLastName", existing?.last_name || "");
      setModalValue("editPassword", "");
      setModalValue("editRole", existing?.role || "member");
      setModalValue("editPositionLibraryAccess", existing?.position_library_access || "edit");
      setModalValue("editTrainingAccess", existing?.training_access || "edit");
      setModalValue("editTournamentAccess", existing?.tournament_access || "edit");
      document.getElementById("userModalBackdrop").classList.add("open");
      setTimeout(() => document.getElementById("editEmail")?.focus(), 0);
    }

    function closeUserModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById("userModalBackdrop").classList.remove("open");
    }

    async function loadUsers() {
      const admin = await requireAdmin();
      if (!admin) return;

      const { data: profiles, error: profilesError } = await supabaseClient
        .from("profiles")
        .select("id,email,first_name,last_name,full_name")
        .order("email", { ascending: true });

      if (profilesError) {
        setMsg("Profiles laden fehlgeschlagen: " + profilesError.message, "err");
        return;
      }

      const { data: roles, error: rolesError } = await supabaseClient
        .from("user_roles")
        .select("user_id,role,position_library_access,training_access,tournament_access");

      if (rolesError) {
        setMsg("Rollen laden fehlgeschlagen: " + rolesError.message, "err");
        return;
      }

      const { data: loginEvents, error: loginEventsError } = await supabaseClient
        .from("login_events")
        .select("user_id,email,user_agent,created_at")
        .order("created_at", { ascending: false })
        .limit(200);

      if (loginEventsError) {
        setMsg("Login-Tracking laden fehlgeschlagen. Bitte SQL aus sql/user_admin_roles.sql ausführen.", "err");
      }

      const roleByUser = {};
      (roles || []).forEach((r) => {
        roleByUser[r.user_id] = {
          role: r.role || "member",
          position_library_access: r.position_library_access || "edit",
          training_access: r.training_access || "edit",
          tournament_access: r.tournament_access || "edit"
        };
      });

      const table = document.getElementById("usersTable");
      table.innerHTML = `
        <tr>
          <th>E-Mail</th>
          <th>Name</th>
          <th>Rolle</th>
          <th>Positions Library</th>
          <th>Training</th>
          <th>Turnier</th>
          <th>Letzter Login</th>
          <th>Aktion</th>
        </tr>
      `;

      const latestLoginByUser = {};
      (loginEvents || []).forEach((entry) => {
        if (!latestLoginByUser[entry.user_id]) latestLoginByUser[entry.user_id] = entry;
      });

      userRows = (profiles || []).map((p) => {
        const roleInfo = roleByUser[p.id] || {};
        return {
          ...p,
          role: roleInfo.role || "member",
          position_library_access: normalizePositionLibraryAccess(roleInfo.position_library_access),
          training_access: normalizeTrainingAccess(roleInfo.training_access),
          tournament_access: normalizeTournamentAccess(roleInfo.tournament_access)
        };
      });

      userRows.forEach((p) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(p.email || "-")}</td>
          <td>${escapeHtml(getUserDisplayName(p))}</td>
          <td><span class="pill">${escapeHtml(p.role)}</span></td>
          <td>${escapeHtml(accessLabel(p.position_library_access))}</td>
          <td>${escapeHtml(accessLabel(p.training_access))}</td>
          <td>${escapeHtml(accessLabel(p.tournament_access))}</td>
          <td>${formatDateTime(latestLoginByUser[p.id]?.created_at)}</td>
          <td>
            <button class="save-btn" type="button" onclick="openUserModal('${p.id}')">Bearbeiten</button>
          </td>
        `;
        table.appendChild(row);
      });

      renderLoginEvents(loginEvents || []);
    }

    function renderLoginEvents(events) {
      const table = document.getElementById("loginEventsTable");
      table.innerHTML = `
        <tr>
          <th>Zeit</th>
          <th>E-Mail</th>
          <th>Browser</th>
        </tr>
      `;

      if (!events.length) {
        const row = document.createElement("tr");
        row.innerHTML = `<td colspan="3" class="muted">Noch keine Login-Einträge vorhanden.</td>`;
        table.appendChild(row);
        return;
      }

      events.slice(0, 50).forEach((entry) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${formatDateTime(entry.created_at)}</td>
          <td>${escapeHtml(entry.email || "-")}</td>
          <td class="muted">${escapeHtml(summarizeUserAgent(entry.user_agent))}</td>
        `;
        table.appendChild(row);
      });
    }

    async function saveUser() {
      const admin = await requireAdmin();
      if (!admin) return;
      setMsg("", "");

      const saveBtn = document.getElementById("saveUserBtn");
      const userId = document.getElementById("editUserId").value;
      const firstName = document.getElementById("editFirstName").value.trim();
      const lastName = document.getElementById("editLastName").value.trim();
      const payload = {
        user_id: userId || undefined,
        email: document.getElementById("editEmail").value.trim(),
        password: document.getElementById("editPassword").value,
        first_name: firstName,
        last_name: lastName,
        role: document.getElementById("editRole").value,
        position_library_access: normalizePositionLibraryAccess(document.getElementById("editPositionLibraryAccess").value),
        training_access: normalizeTrainingAccess(document.getElementById("editTrainingAccess").value),
        tournament_access: normalizeTournamentAccess(document.getElementById("editTournamentAccess").value)
      };

      if (!payload.email || !firstName || !lastName) {
        setMsg("Bitte E-Mail, Vorname und Nachname eingeben.", "err");
        return;
      }
      if (!userId && (!payload.password || payload.password.length < 6)) {
        setMsg("Bitte ein Passwort mit mindestens 6 Zeichen eingeben.", "err");
        return;
      }

      async function readFunctionError(error) {
        try {
          const context = error?.context;
          if (context && typeof context.json === "function") {
            const body = await context.json();
            return body?.message || body?.error || error.message;
          }
          if (context && typeof context.text === "function") {
            const text = await context.text();
            return text || error.message;
          }
        } catch (parseError) {
          console.warn("Function-Fehler konnte nicht gelesen werden:", parseError);
        }
        return error?.message || "Unbekannter Fehler";
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "Speichert...";
      const { data, error } = await supabaseClient.functions.invoke("admin-upsert-user", {
        body: payload
      });
      saveBtn.disabled = false;
      saveBtn.innerText = "Speichern";

      if (error) {
        setMsg("User speichern fehlgeschlagen: " + await readFunctionError(error), "err");
        return;
      }
      if (data?.error) {
        setMsg("User speichern fehlgeschlagen: " + (data.message || data.error), "err");
        return;
      }

      closeUserModal();
      setMsg(userId ? "User gespeichert." : "User erstellt.", "ok");
      await loadUsers();
    }

    loadUsers();
  </script>
</body>
</html>
