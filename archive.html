<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Archiv</title>

<style>
html {
    min-height: 100%;
    background: linear-gradient(180deg, #1e1f29, #14151c);
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #1e1f29, #14151c);
    color: white;
}

.page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px 40px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}

h1 {
    margin: 0;
    font-size: 42px;
    text-align: center;
}

.table-wrap {
    background: #222431;
    border: 1px solid #33384b;
    border-radius: 14px;
    overflow: hidden;
}

.bulk-actions {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
    padding: 12px 14px;
    background: #222431;
    border: 1px solid #33384b;
    border-radius: 10px;
}

.bulk-actions.visible {
    display: flex;
}

.bulk-delete-btn:disabled {
    cursor: not-allowed;
    opacity: .45;
}

.select-col {
    width: 44px;
    padding-left: 14px;
    padding-right: 6px;
    text-align: center;
}

.match-checkbox,
#selectAllMatches {
    width: 19px;
    height: 19px;
    cursor: pointer;
    accent-color: #d34a4a;
}

.pagination {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 18px;
}

.pagination.visible {
    display: flex;
}

.pagination .nav-btn {
    min-width: 120px;
    font-size: 15px;
    padding: 8px 16px;
}

.pagination .nav-btn:disabled {
    cursor: not-allowed;
    opacity: .4;
}

#pageInfo {
    min-width: 120px;
    text-align: center;
    color: #c7cede;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    text-align: left;
    background: #181922;
    color: #c7cede;
    font-size: 14px;
    letter-spacing: 0.3px;
    padding: 14px 16px;
}

td {
    padding: 14px 16px;
    border-top: 1px solid #34384a;
}

tr.data-row:hover {
    background: #2a2e40;
    cursor: pointer;
}

.actions-col {
    width: 110px;
}

.delete-btn {
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 700;
    background: #b43d3d;
    color: white;
    cursor: pointer;
}

.delete-btn:hover {
    background: #d34a4a;
}

.status {
    display: inline-block;
    min-width: 90px;
    text-align: center;
    font-size: 13px;
    border-radius: 999px;
    padding: 4px 10px;
}

.status.running {
    background: #563315;
    color: #ffcc97;
}

.status.finished {
    background: #174a2f;
    color: #a3e5bf;
}

.empty {
    text-align: center;
    color: #a7afc3;
}

.actions {
    margin-top: 22px;
    text-align: center;
}

.nav-btn {
    font-size: 18px;
    padding: 10px 28px;
    border: none;
    border-radius: 8px;
    background: #444;
    color: white;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="page">
    <div class="topbar">
        <button class="nav-btn" onclick="window.location.href='/'">Zur&uuml;ck</button>
        <h1>Archiv</h1>
        <div style="width:122px"></div>
    </div>

    <div class="bulk-actions" id="bulkActions">
        <span id="selectionCount">0 Partien ausgew&auml;hlt</span>
        <button class="delete-btn bulk-delete-btn" id="bulkDeleteBtn" type="button" onclick="deleteSelectedMatches()" disabled>Ausgew&auml;hlte l&ouml;schen</button>
    </div>

    <div class="table-wrap">
        <table id="archiveTable">
            <tr>
                <th>Datum</th>
                <th>Spieler</th>
                <th>Disziplinen</th>
                <th>Ergebnis</th>
                <th>Aufnahmen</th>
                <th class="actions-col">Aktion</th>
            </tr>
        </table>
    </div>

    <div class="pagination" id="pagination">
        <button class="nav-btn" id="previousPageBtn" type="button" onclick="changePage(-1)">Zur&uuml;ck</button>
        <span id="pageInfo">Seite 1 von 1</span>
        <button class="nav-btn" id="nextPageBtn" type="button" onclick="changePage(1)">Weiter</button>
    </div>

    <div class="actions">
        <button class="nav-btn" onclick="window.location.href='/'">Zur&uuml;ck</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
    <script src="js/match_access.js"></script>
    <script src="js/user_menu.js"></script>

<script>
let archiveIsAdmin = false;
const selectedMatchIds = new Set();
const archivePageSize = 20;
let archiveMatches = [];
let archivePage = 1;

async function loadArchive() {
    const user = await requireAuth();
    if (!user) return;
    const accessMode = await getMatchAccess(user);
    if (!isMatchVisible(accessMode)) {
        document.body.innerHTML = "<div style='padding:40px;font-family:Arial'>Kein Zugriff auf Match.</div>";
        return;
    }
    const isAdmin = await hasAdminAccess(user);
    archiveIsAdmin = isAdmin;
    selectedMatchIds.clear();
    archivePage = 1;
    document.getElementById("bulkActions").classList.toggle("visible", isAdmin);
    updateBulkSelection();
    const ownedNames = await getOwnedPlayerNames(user.id);

    const { data, error } = await supabaseClient
        .from("matches")
        .select("*")
        .eq("finished", 1)
        .eq("status", 0)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Archiv laden fehlgeschlagen:", error);
        return;
    }

    archiveMatches = isAdmin
        ? (data || [])
        : (data || []).filter((match) =>
            isOwnedMatch(match, user.id, ownedNames)
        );
    renderArchivePage();
}

function renderArchivePage() {
    const table = document.getElementById("archiveTable");
    table.innerHTML = `
        <tr>
            ${archiveIsAdmin ? `<th class="select-col"><input id="selectAllMatches" type="checkbox" aria-label="Alle sichtbaren Partien ausw&auml;hlen" onchange="toggleAllMatches(this.checked)"></th>` : ""}
            <th>Datum</th>
            <th>Spieler</th>
            <th>Disziplinen</th>
            <th>Ergebnis</th>
            <th>Aufnahmen</th>
            <th class="actions-col">Aktion</th>
        </tr>
    `;

    const pageCount = Math.max(1, Math.ceil(archiveMatches.length / archivePageSize));
    archivePage = Math.min(Math.max(1, archivePage), pageCount);
    const pageStart = (archivePage - 1) * archivePageSize;
    const visibleMatches = archiveMatches.slice(pageStart, pageStart + archivePageSize);

    if (archiveMatches.length === 0) {
        const row = document.createElement("tr");
        row.innerHTML = `<td class="empty" colspan="${archiveIsAdmin ? 7 : 6}">Keine Partien gefunden</td>`;
        table.appendChild(row);
    }

    visibleMatches.forEach((match) => {
        const row = document.createElement("tr");
        row.className = "data-row";

        const createdAt = match.created_at || match.started_at;
        const date = createdAt ? new Date(createdAt).toLocaleString() : "-";
        const discipline1 = match.discipline1 || "-";
        const discipline2 = match.discipline2 || "-";
        const disciplineText = discipline1 === discipline2
            ? discipline1
            : `${discipline1} / ${discipline2}`;
        const playedInnings = Math.max(
            Number(match.inn1 || 0),
            Number(match.inn2 || 0)
        );

        row.innerHTML = `
            ${archiveIsAdmin ? `<td class="select-col"><input class="match-checkbox" type="checkbox" value="${match.id}" aria-label="Partie ausw&auml;hlen" onchange="toggleMatchSelection(event, '${match.id}', this.checked)" ${selectedMatchIds.has(String(match.id)) ? "checked" : ""}></td>` : ""}
            <td>${date}</td>
            <td>${match.player1} vs ${match.player2}</td>
            <td>${disciplineText}</td>
            <td>${match.score1 ?? 0} : ${match.score2 ?? 0}</td>
            <td>${playedInnings > 0 ? playedInnings : "-"}</td>
            <td>${archiveIsAdmin ? `<button class="delete-btn" onclick="deleteArchivedMatch(event, '${match.id}')">Löschen</button>` : ""}</td>
        `;

        row.onclick = (event) => {
            if (event.target.closest(".delete-btn") || event.target.closest(".actions-col") || event.target.closest(".select-col")) {
                return;
            }
            window.location.href = "archive_detail.html?id=" + match.id;
        };

        table.appendChild(row);
    });

    const pagination = document.getElementById("pagination");
    pagination.classList.toggle("visible", archiveMatches.length > archivePageSize);
    document.getElementById("pageInfo").innerText = `Seite ${archivePage} von ${pageCount}`;
    document.getElementById("previousPageBtn").disabled = archivePage <= 1;
    document.getElementById("nextPageBtn").disabled = archivePage >= pageCount;
    updateBulkSelection();
}

function changePage(offset) {
    const pageCount = Math.max(1, Math.ceil(archiveMatches.length / archivePageSize));
    const nextPage = Math.min(pageCount, Math.max(1, archivePage + Number(offset || 0)));
    if (nextPage === archivePage) return;
    archivePage = nextPage;
    renderArchivePage();
    document.querySelector(".table-wrap").scrollIntoView({ behavior: "smooth", block: "start" });
}

function toggleMatchSelection(event, matchId, checked) {
    event.stopPropagation();
    if (checked) selectedMatchIds.add(String(matchId));
    else selectedMatchIds.delete(String(matchId));
    updateBulkSelection();
}

function toggleAllMatches(checked) {
    document.querySelectorAll(".match-checkbox").forEach((checkbox) => {
        checkbox.checked = checked;
        if (checked) selectedMatchIds.add(String(checkbox.value));
        else selectedMatchIds.delete(String(checkbox.value));
    });
    updateBulkSelection();
}

function updateBulkSelection() {
    const count = selectedMatchIds.size;
    const countEl = document.getElementById("selectionCount");
    const deleteBtn = document.getElementById("bulkDeleteBtn");
    if (countEl) countEl.innerText = count === 1 ? "1 Partie ausgewählt" : `${count} Partien ausgewählt`;
    if (deleteBtn) deleteBtn.disabled = count === 0;

    const checkboxes = [...document.querySelectorAll(".match-checkbox")];
    const selectAll = document.getElementById("selectAllMatches");
    if (selectAll) {
        selectAll.checked = checkboxes.length > 0 && checkboxes.every((checkbox) => checkbox.checked);
        selectAll.indeterminate = checkboxes.some((checkbox) => checkbox.checked) && !selectAll.checked;
    }
}

async function deleteSelectedMatches() {
    if (!archiveIsAdmin || selectedMatchIds.size === 0) return;
    const user = await requireAdmin();
    if (!user) return;

    const ids = [...selectedMatchIds];
    const label = ids.length === 1 ? "diese Partie" : `diese ${ids.length} Partien`;
    if (!confirm(`${label} wirklich endgültig löschen?`)) return;

    const button = document.getElementById("bulkDeleteBtn");
    button.disabled = true;
    button.innerText = "Wird gelöscht...";

    const { error: matchDeleteError } = await supabaseClient
        .from("matches")
        .delete()
        .in("id", ids);

    if (matchDeleteError) {
        console.error("Partien löschen fehlgeschlagen:", matchDeleteError);
        alert("Löschen fehlgeschlagen. Bitte erneut versuchen.");
        button.innerText = "Ausgewählte löschen";
        updateBulkSelection();
        return;
    }

    const { error: archiveDeleteError } = await supabaseClient
        .from("archive")
        .delete()
        .in("matchId", ids);

    if (archiveDeleteError) {
        console.warn("Archiv-Aufräumen fehlgeschlagen:", archiveDeleteError);
    }

    button.innerText = "Ausgewählte löschen";
    await loadArchive();
}

async function deleteArchivedMatch(event, matchId) {
    const user = await requireAdmin();
    if (!user) return;

    event.stopPropagation();
    event.preventDefault();

    if (!confirm("Partie wirklich löschen?")) {
        return;
    }

    const { error: matchDeleteError } = await supabaseClient
        .from("matches")
        .delete()
        .eq("id", matchId);

    if (matchDeleteError) {
        console.error("Partie löschen fehlgeschlagen:", matchDeleteError);
        alert("Löschen fehlgeschlagen. Bitte erneut versuchen.");
        return;
    }

    // Optional: verknüpfte Archivzeile aufräumen, falls vorhanden.
    const { error: archiveDeleteError } = await supabaseClient
        .from("archive")
        .delete()
        .eq("matchId", matchId);

    if (archiveDeleteError) {
        console.warn("Archiv-Aufräumen fehlgeschlagen:", archiveDeleteError);
    }

    await loadArchive();
}

loadArchive();
</script>

</body>
</html>
