<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Billard Studio</title>

    <style>
        html {
            min-height: 100%;
            background: linear-gradient(180deg, #1e1f29, #14151c);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial;
            background: linear-gradient(180deg, #1e1f29, #14151c);
            color: white;
            visibility: hidden;
        }

        body.auth-ready {
            visibility: visible;
        }

        #exitZone {
            position: fixed;
            top: 0;
            right: 0;
            width: 120px;
            height: 120px;
            z-index: 9999;
        }

        .header {
            text-align: center;
            padding: 60px 0 18px 0;
            font-size: 48px;
            font-weight: 600;
            position: relative;
        }

        .active-section {
            width: 1000px;
            max-width: 92%;
            margin: 0 auto 34px;
            display: none;
        }

        .active-section.open {
            display: block;
        }

        .active-heading {
            margin: 0 0 10px;
            font-size: 17px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.82);
        }

        .active-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .active-match {
            border: 1px solid rgba(255, 77, 77, 0.72);
            border-radius: 14px;
            background: rgba(42, 43, 53, 0.92);
            color: white;
            cursor: pointer;
            padding: 14px 16px;
            text-align: left;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
            transition: 0.2s;
        }

        .active-match:hover {
            background: #343744;
            transform: translateY(-2px);
        }

        .active-match-title {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 6px;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.25;
        }

        .active-dot {
            flex: 0 0 auto;
            width: 11px;
            height: 11px;
            border-radius: 999px;
            background: #ff3333;
            box-shadow: 0 0 0 4px rgba(255, 51, 51, 0.12);
        }

        .active-match-meta {
            margin-left: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.66);
            line-height: 1.45;
        }

        .grid {
            width: 1000px;
            max-width: 92%;
            margin: 42px auto 60px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }

        .tile {
            background: #2a2b35;
            border-radius: 25px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .admin-only {
            display: none;
        }

        .tile:hover {
            background: #3f4fa3;
            transform: translateY(-6px);
        }

        .tile-title {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .tile-sub {
            font-size: 14px;
            opacity: 0.6;
        }

        .tile.live {
            border: 2px solid #ff4d4d;
            animation: pulse 1.8s infinite;
        }

        .tile.invite {
            border: 2px solid #4da3ff;
            animation: pulseInvite 1.8s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        @keyframes pulseInvite {
            0% { box-shadow: 0 0 0 0 rgba(77, 163, 255, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(77, 163, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(77, 163, 255, 0); }
        }

        .footer {
            text-align: center;
            margin-top: 100px;
            font-size: 14px;
            opacity: 0.4;
        }

        @media (max-width: 760px) {
            .active-list {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div id="exitZone"></div>

    <div class="header">
        Billard Studio
    </div>

    <section id="activeMatchesSection" class="active-section" aria-label="Aktive Partien">
        <h2 class="active-heading">Aktive Partien</h2>
        <div id="activeMatchesList" class="active-list"></div>
    </section>

    <div class="grid" id="mainGrid">

        <div id="matchTile" class="tile" onclick="window.location.href='match_setup.html'" style="display:none;">
            <div class="tile-title">Match</div>
            <div class="tile-sub">Neue Partie starten</div>
        </div>

        <div id="trainingTile" class="tile" onclick="window.location.href='training.html'" style="display:none;">
            <div class="tile-title">Training</div>
            <div class="tile-sub">Übungen & Serienmodus</div>
        </div>

        <div id="tournamentTile" class="tile" onclick="window.location.href='turnier.html'" style="display:none;">
            <div class="tile-title">Turnier</div>
            <div class="tile-sub">Jeder gegen jeden mit Tabelle</div>
        </div>

        <div id="calendarTile" class="tile" onclick="window.location.href='calendar.html'" style="display:none;">
            <div class="tile-title">NBV Karambol-Kalender</div>
        </div>

        <div id="playersTile" class="tile" onclick="window.location.href='players.html'" style="display:none;">
            <div class="tile-title">Spielerverwaltung</div>
            <div class="tile-sub">Spieler hinzufügen & löschen</div>
        </div>

        <div id="archiveTile" class="tile" onclick="window.location.href='archive.html'" style="display:none;">
            <div class="tile-title">Archiv</div>
            <div class="tile-sub">Gespielte Partien ansehen</div>
        </div>

        <div id="usersTile" class="tile admin-only" onclick="window.location.href='users.html'">
            <div class="tile-title">Userverwaltung</div>
            <div class="tile-sub">Rollen & Rechte verwalten</div>
        </div>

    </div>

    <script>
        let exitTimer = null;
        const exitZone = document.getElementById("exitZone");

        exitZone.addEventListener("touchstart", () => {
            exitTimer = setTimeout(() => {
                window.open('', '_self');
                window.close();
            }, 5000);
        });

        exitZone.addEventListener("touchend", () => {
            clearTimeout(exitTimer);
        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/match_access.js"></script>
    <script src="js/training_access.js"></script>
    <script src="js/tournament_access.js"></script>
    <script src="js/calendar_access.js"></script>
    <script src="js/club_mobile_access.js"></script>
    <script src="js/user_menu.js"></script>

    <script>
        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function loadCountdownInvites(user) {
            if (!user?.email) return;
            const guestEmail = String(user.email).trim().toLowerCase();
            if (!guestEmail) return;

            const { data, error } = await supabaseClient
                .from("training_countdown_hs_sessions")
                .select("id,host_name,host_discipline,guest_discipline,duration_minutes,status")
                .eq("guest_email", guestEmail)
                .eq("status", "active")
                .order("created_at", { ascending: false })
                .limit(3);

            if (error) {
                console.warn("Countdown-Einladungen konnten nicht geladen werden:", error);
                return;
            }

            const invites = data || [];
            if (invites.length === 0) return;

            const grid = document.getElementById("mainGrid");
            invites.reverse().forEach((invite) => {
                const tile = document.createElement("div");
                tile.className = "tile invite";
                tile.onclick = () => {
                    window.location.href = "training_countdown_hs_run.html?session=" + invite.id;
                };

                tile.innerHTML = `
  <div class="tile-title">🔵 Countdown Einladung</div>
  <div class="tile-sub">${invite.host_name || "Spieler 1"} · ${invite.duration_minutes || 0} min</div>
  <div class="tile-sub" style="margin-top:8px;font-size:16px;opacity:0.9;">
    ${invite.host_discipline || "-"} vs ${invite.guest_discipline || "-"}
  </div>
`;
                grid.prepend(tile);
            });
        }

        async function loadRemoteMatchInvites(user) {
            if (!user?.id) return;
            const guestEmail = String(user.email || "").trim().toLowerCase();
            const columns = "id,host_name,guest_name,host_discipline,guest_discipline,target_points,status,created_at";
            const queries = [
                supabaseClient
                    .from("training_remote_match_sessions")
                    .select(columns)
                    .eq("guest_user_id", user.id)
                    .eq("status", "active")
                    .order("created_at", { ascending: false })
                    .limit(3)
            ];
            if (guestEmail) {
                queries.push(
                    supabaseClient
                        .from("training_remote_match_sessions")
                        .select(columns)
                        .ilike("guest_email", guestEmail)
                        .eq("status", "active")
                        .order("created_at", { ascending: false })
                        .limit(3)
                );
            }

            const results = await Promise.all(queries);
            results.forEach((result) => {
                if (result.error) console.warn("Remote-Match-Einladungen konnten nicht geladen werden:", result.error);
            });

            const invitesById = new Map();
            results.forEach((result) => {
                (result.data || []).forEach((invite) => invitesById.set(invite.id, invite));
            });
            const invites = Array.from(invitesById.values())
                .sort((left, right) => new Date(right.created_at || 0) - new Date(left.created_at || 0))
                .slice(0, 3);
            if (invites.length === 0) {
                return;
            }

            const grid = document.getElementById("mainGrid");
            invites.reverse().forEach((invite) => {
                const tile = document.createElement("div");
                tile.className = "tile invite";
                tile.onclick = () => {
                    window.location.href = "training_remote_match_run.html?session=" + invite.id;
                };

                tile.innerHTML = `
  <div class="tile-title">Remote Match Einladung</div>
  <div class="tile-sub">${invite.host_name || "Spieler 1"} vs ${invite.guest_name || "du"}</div>
  <div class="tile-sub" style="margin-top:8px;font-size:16px;opacity:0.9;">
    ${invite.host_discipline || "-"} vs ${invite.guest_discipline || "-"} · ${invite.target_points || 0} Punkte
  </div>
`;
                grid.prepend(tile);
            });
        }

        async function loadUserRoleSettings(userId) {
            if (!userId) return { roleRow: null, roleError: null };
            const { data, error } = await supabaseClient
                .from("user_roles")
                .select("role,match_access,training_access,tournament_access,calendar_access,club_mobile_access")
                .eq("user_id", userId)
                .maybeSingle();

            if (error) {
                console.warn("Rechte konnten nicht geladen werden:", userId, error);
            }
            return { roleRow: data || null, roleError: error || null };
        }

        function resolveStartAccess(user, roleRow, roleError) {
            const isAdmin = isAdminUser(user) || roleRow?.role === "admin";
            if (isAdmin) {
                return {
                    isAdmin,
                    club: "edit",
                    match: "edit",
                    training: "edit",
                    tournament: "edit",
                    calendar: "edit"
                };
            }

            if (roleError) {
                return {
                    isAdmin: false,
                    club: "hidden",
                    match: "hidden",
                    training: "edit",
                    tournament: "edit",
                    calendar: "hidden"
                };
            }

            return {
                isAdmin: false,
                club: normalizeClubMobileAccess(roleRow?.club_mobile_access),
                match: normalizeMatchAccess(roleRow?.match_access),
                training: normalizeTrainingAccess(roleRow?.training_access),
                tournament: normalizeTournamentAccess(roleRow?.tournament_access),
                calendar: normalizeCalendarAccess(roleRow?.calendar_access)
            };
        }

        function applyStartAccess(access) {
            ["matchTile", "playersTile", "archiveTile"].forEach((id) => {
                const tile = document.getElementById(id);
                if (tile) tile.style.display = isMatchVisible(access.match) ? "" : "none";
            });

            const trainingTile = document.getElementById("trainingTile");
            if (trainingTile) trainingTile.style.display = isTrainingVisible(access.training) ? "" : "none";

            const tile = document.getElementById("tournamentTile");
            if (tile) tile.style.display = isTournamentVisible(access.tournament) ? "" : "none";

            const calendarTile = document.getElementById("calendarTile");
            if (calendarTile) calendarTile.style.display = isCalendarVisibleForUser(access.calendar) ? "" : "none";

            const usersTile = document.getElementById("usersTile");
            if (usersTile) usersTile.style.display = access.isAdmin ? "flex" : "none";
        }

        async function loadLiveMatches() {
            const user = await requireAuth();
            if (!user) return;

            document.body.classList.add("auth-ready");

            const { roleRow, roleError } = await loadUserRoleSettings(user.id);
            const access = resolveStartAccess(user, roleRow, roleError);
            applyStartAccess(access);

            if (!access.isAdmin &&
                isClubMobileVisible(access.club) &&
                !isMatchVisible(access.match) &&
                !isTrainingVisible(access.training) &&
                !isTournamentVisible(access.tournament) &&
                !isCalendarVisibleForUser(access.calendar)) {
                window.location.replace("/club_mobile.html");
                return;
            }

            loadCountdownInvites(user).catch((error) => {
                console.warn("Countdown-Einladungen konnten nicht initialisiert werden:", error);
            });
            loadRemoteMatchInvites(user).catch((error) => {
                console.warn("Remote-Match-Einladungen konnten nicht initialisiert werden:", error);
            });

            const [ownedNames, matchesResult] = await Promise.all([
                getOwnedPlayerNames(user.id),
                supabaseClient
                    .from("matches")
                    .select("*")
                    .eq("status", 1)
                    .eq("finished", 0)
                    .order("started_at", { ascending: false })
            ]);

            const { data, error } = matchesResult;

            if (error) {
                console.log("Fehler:", error);
                return;
            }

            const filtered = access.isAdmin
                ? (data || [])
                : (data || []).filter((match) =>
                    isOwnedMatch(match, user.id, ownedNames)
                );

            const activeSection = document.getElementById("activeMatchesSection");
            const activeList = document.getElementById("activeMatchesList");
            activeList.innerHTML = "";

            filtered.forEach(match => {
                const activeMatch = document.createElement("button");
                activeMatch.type = "button";
                activeMatch.className = "active-match";
                activeMatch.onclick = () => {
                    window.location.href = "scoreboard.html?match=" + match.id;
                };

                activeMatch.innerHTML = `
  <div class="active-match-title"><span class="active-dot"></span><span>${escapeHtml(match.player1 || "Spieler 1")} vs ${escapeHtml(match.player2 || "Spieler 2")}</span></div>
  <div class="active-match-meta">${escapeHtml(match.discipline1 || "-")} · ${Number(match.score1 || 0)} : ${Number(match.score2 || 0)} · Aufnahme ${Number(match.totalInnings || 0)}</div>
`;

                activeList.appendChild(activeMatch);
            });

            if (filtered.length > 0) {
                activeSection.classList.add("open");
            }
        }

        loadLiveMatches()
            .catch((error) => {
                console.error("Startseite konnte nicht initialisiert werden:", error);
            })
            .finally(() => {
                document.body.classList.add("auth-ready");
            });
    </script>

</body>

</html>
