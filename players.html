<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spielerverwaltung</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:linear-gradient(180deg,#1e1f29,#14151c);
    color:white;
    text-align:center;
}

h1 {
    margin-top:40px;
    font-size:40px;
}

.container {
    width:min(1080px, 92%);
    margin:40px auto;
}

.notice {
    display:none;
    margin-bottom:20px;
    padding:14px 16px;
    border-radius:12px;
    background:#394064;
    color:#eef2ff;
    font-size:16px;
}

.add-box {
    background:#2a2b35;
    padding:20px;
    border-radius:15px;
    margin-bottom:30px;
}

.filter-box {
    display:none;
    background:#222432;
    padding:14px 16px;
    border-radius:12px;
    margin-bottom:18px;
    text-align:left;
}

.filter-grid {
    display:grid;
    grid-template-columns:minmax(220px, 360px) 1fr;
    gap:12px;
    align-items:end;
}

.filter-field {
    display:flex;
    flex-direction:column;
    gap:6px;
}

.filter-field label {
    font-size:14px;
    color:rgba(255,255,255,0.72);
}

.filter-field select {
    width:100%;
    box-sizing:border-box;
    border:none;
    border-radius:8px;
    padding:10px;
    font-size:16px;
    background:#eef2ff;
    color:#14151c;
}

.filter-info {
    color:rgba(255,255,255,0.72);
    font-size:14px;
    padding-bottom:10px;
}

.add-grid {
    display:grid;
    grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr) minmax(180px, 260px) auto auto;
    gap:12px;
    align-items:center;
}

.add-box input,
.add-box select {
    font-size:18px;
    padding:10px;
    border-radius:8px;
    border:none;
    width:100%;
    box-sizing:border-box;
}

.add-box button {
    font-size:18px;
    padding:10px 20px;
    background:#3f4fa3;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.checkbox-wrap {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:16px;
    white-space:nowrap;
}

.checkbox-wrap input {
    width:18px;
    height:18px;
}

.admin-owner-field {
    display:none;
}

table {
    width:100%;
    border-collapse:collapse;
    background:#2a2b35;
    border-radius:15px;
    overflow:hidden;
}

th {
    background:#181922;
    padding:15px;
}

td {
    padding:15px;
    border-top:1px solid #333;
}

.delete-btn {
    background:#b33939;
    border:none;
    color:white;
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
}

.delete-btn:hover {
    background:#d64545;
}

.save-btn {
    background:#3f7c58;
    border:none;
    color:white;
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
    margin-right:8px;
}

.save-btn:hover {
    background:#4a9468;
}

.row-input {
    width:100%;
    box-sizing:border-box;
    font-size:16px;
    padding:8px 10px;
    border-radius:8px;
    border:none;
    background:#eef2ff;
}

.row-check {
    width:18px;
    height:18px;
}

.nav-btn {
    margin-top:40px;
    padding:10px 30px;
    font-size:18px;
    background:#444;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

@media (max-width: 840px) {
    .add-grid,
    .filter-grid {
        grid-template-columns:1fr;
    }

    table, thead, tbody, th, td, tr {
        display:block;
    }

    table {
        background:transparent;
    }

    tr {
        background:#2a2b35;
        border-radius:15px;
        margin-bottom:16px;
        overflow:hidden;
    }

    th {
        display:none;
    }

    td {
        border-top:1px solid #333;
    }
}
</style>
</head>
<body>

<h1>Spielerverwaltung</h1>

<div class="container">
    <div class="notice" id="noticeBox"></div>

    <div class="add-box">
        <div class="add-grid">
            <input type="text" id="newPlayer" placeholder="Neuer Spieler">
            <input type="email" id="newPlayerEmail" placeholder="E-Mail für Ergebnisversand">
            <select id="newPlayerOwner" class="admin-owner-field" title="Zuordnung"></select>
            <label class="checkbox-wrap" for="newPlayerSendEmail">
                <input type="checkbox" id="newPlayerSendEmail">
                <span>Partie-Ergebnis per Mail</span>
            </label>
            <button onclick="addPlayer()">Hinzufügen</button>
        </div>
    </div>

    <div class="filter-box" id="adminFilterBox">
        <div class="filter-grid">
            <div class="filter-field">
                <label for="ownerFilter">Zuordnung filtern</label>
                <select id="ownerFilter" onchange="renderPlayers()"></select>
            </div>
            <div class="filter-info" id="filterInfo"></div>
        </div>
    </div>

    <table id="playerTable">
        <tr>
            <th>Name</th>
            <th>E-Mail</th>
            <th>Ergebnis per Mail</th>
            <th>Aktion</th>
        </tr>
    </table>

</div>

<button class="nav-btn" onclick="window.location.href='index.html'">
Zurück
</button>
<button id="importNavBtn" class="nav-btn" style="display:none;" onclick="window.location.href='players_import.html'">
CSV Import
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
    <script src="js/match_access.js"></script>
    <script src="js/user_menu.js"></script>



<script>
let currentUserId = "";
let currentIsAdmin = false;
let supportsEmailSettings = true;
let userLabelsById = new Map();
let allPlayers = [];

function setNotice(text) {
    const box = document.getElementById("noticeBox");
    if (!box) return;
    box.style.display = text ? "block" : "none";
    box.innerText = text || "";
}

async function loadScopedPlayers() {
    let query = supabaseClient
        .from("players")
        .select("id,name,email,send_match_result_email,user_id")
        .order("name", { ascending: true });
    if (!currentIsAdmin) {
        query = query.eq("user_id", currentUserId);
    }
    let result = await query;

    if (!result.error) {
        supportsEmailSettings = true;
        return result;
    }

    const message = String(result.error.message || "").toLowerCase();

    // Fallback für altes Schema ohne neue Mail-Felder oder user_id.
    if (message.includes("user_id") || message.includes("email") || message.includes("send_match_result_email")) {
        supportsEmailSettings = false;
        console.warn("players-Mailspalten fehlen oder players.user_id fehlt, nutze Kompatibilitätsmodus.");
        result = await supabaseClient
            .from("players")
            .select("id,name")
            .order("name", { ascending: true });
    }
    return result;
}

function profileLabel(profile) {
    if (!profile) return "";
    return (
        profile.full_name ||
        [profile.first_name, profile.last_name].filter(Boolean).join(" ") ||
        profile.email ||
        profile.id ||
        ""
    );
}

async function loadUserLabels() {
    userLabelsById = new Map();
    if (!currentIsAdmin) return;

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,email,first_name,last_name,full_name")
        .order("email", { ascending: true });

    if (error) {
        console.warn("User-Zuordnung konnte nicht geladen werden:", error);
        return;
    }

    (data || []).forEach((profile) => {
        userLabelsById.set(profile.id, profileLabel(profile));
    });
}

function getOwnerLabel(userId) {
    if (!userId) return "ohne Zuordnung";
    return userLabelsById.get(userId) || userId;
}

function populateOwnerFilter(players) {
    const box = document.getElementById("adminFilterBox");
    const select = document.getElementById("ownerFilter");
    if (!box || !select) return;
    box.style.display = currentIsAdmin ? "block" : "none";
    if (!currentIsAdmin) return;

    const previous = select.value || "all";
    select.innerHTML = "";
    select.add(new Option("Alle Zuordnungen", "all"));
    select.add(new Option("ohne Zuordnung", "none"));

    const owners = new Map();
    userLabelsById.forEach((label, userId) => owners.set(userId, label));
    (players || []).forEach((player) => {
        if (player.user_id && !owners.has(player.user_id)) {
            owners.set(player.user_id, player.user_id);
        }
    });

    Array.from(owners.entries())
        .sort((left, right) => left[1].localeCompare(right[1], "de"))
        .forEach(([userId, label]) => {
            select.add(new Option(label, userId));
        });

    select.value = Array.from(select.options).some((option) => option.value === previous) ? previous : "all";
}

function populateNewPlayerOwnerSelect() {
    const select = document.getElementById("newPlayerOwner");
    if (!select) return;
    select.style.display = currentIsAdmin ? "block" : "none";
    if (!currentIsAdmin) return;

    const previous = select.value || currentUserId;
    select.innerHTML = "";
    Array.from(userLabelsById.entries())
        .sort((left, right) => left[1].localeCompare(right[1], "de"))
        .forEach(([userId, label]) => {
            select.add(new Option(label, userId));
        });

    if (!Array.from(select.options).some((option) => option.value === currentUserId)) {
        select.add(new Option("Aktueller User", currentUserId));
    }
    select.value = Array.from(select.options).some((option) => option.value === previous) ? previous : currentUserId;
}

function getFilteredPlayers() {
    const value = document.getElementById("ownerFilter")?.value || "all";
    if (!currentIsAdmin || value === "all") return allPlayers;
    if (value === "none") return allPlayers.filter((player) => !player.user_id);
    return allPlayers.filter((player) => player.user_id === value);
}

function renderPlayers() {
    const data = getFilteredPlayers();
    const table = document.getElementById("playerTable");
    const info = document.getElementById("filterInfo");

    table.innerHTML = `
        <tr>
            <th>Name</th>
            <th>E-Mail</th>
            <th>Ergebnis per Mail</th>
            ${currentIsAdmin ? "<th>Zuordnung</th>" : ""}
            <th>Aktion</th>
        </tr>
    `;

    data.forEach(p => {
        const name = String(p.name || "");
        const email = String(p.email || "");
        const sendMail = Boolean(p.send_match_result_email);

        table.innerHTML += `
            <tr>
                <td>
                    <input class="row-input" id="player-name-${p.id}" value="${escapeHtml(name)}" />
                </td>
                <td>
                    <input class="row-input" id="player-email-${p.id}" type="email" value="${escapeHtml(email)}" ${supportsEmailSettings ? "" : "disabled"} />
                </td>
                <td>
                    <input class="row-check" id="player-send-${p.id}" type="checkbox" ${sendMail ? "checked" : ""} ${supportsEmailSettings ? "" : "disabled"} />
                </td>
                ${currentIsAdmin ? `<td>${escapeHtml(getOwnerLabel(p.user_id))}</td>` : ""}
                <td>
                    <button class="save-btn" onclick="updatePlayer(${p.id})">Speichern</button>
                    <button class="delete-btn" onclick="deletePlayer(${p.id})">
                        Löschen
                    </button>
                </td>
            </tr>
        `;
    });

    if (info && currentIsAdmin) {
        info.innerText = `${data.length} von ${allPlayers.length} Spielern angezeigt`;
    }
}

async function loadPlayers(){
    const user = await requireAuth();
    if (!user) return;
    currentIsAdmin = await hasAdminAccess(user);
    const importBtn = document.getElementById("importNavBtn");
    if (importBtn) importBtn.style.display = currentIsAdmin ? "inline-block" : "none";
    const accessMode = await getMatchAccess(user);
    if (!isMatchVisible(accessMode)) {
        document.body.innerHTML = "<div style='padding:40px;font-family:Arial'>Kein Zugriff auf Match.</div>";
        return;
    }
    currentUserId = user.id;
    await loadUserLabels();

    const { data, error } = await loadScopedPlayers();

    if(error){
        console.error(error);
        return;
    }

    if (!supportsEmailSettings) {
        setNotice("Die Felder für E-Mail-Versand sind in Supabase noch nicht aktiv. Bitte zuerst sql/player_result_email.sql ausführen.");
    } else {
        setNotice("");
    }

    allPlayers = data || [];
    populateNewPlayerOwnerSelect();
    populateOwnerFilter(allPlayers);
    renderPlayers();
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

async function addPlayer(){
    const user = await requireAuth();
    if (!user) return;
    currentUserId = user.id;
    currentIsAdmin = await hasAdminAccess(user);

    const name = document.getElementById("newPlayer").value.trim();
    const email = document.getElementById("newPlayerEmail").value.trim().toLowerCase();
    const sendMail = document.getElementById("newPlayerSendEmail").checked;
    const ownerId = currentIsAdmin
        ? (document.getElementById("newPlayerOwner")?.value || currentUserId)
        : currentUserId;
    if(!name) return;

    let { error } = await supabaseClient
        .from("players")
        .insert([{ name, email: email || null, send_match_result_email: sendMail, user_id: ownerId }]);

    // Fallback für altes Schema ohne neue Felder oder user_id.
    const message = String(error?.message || "").toLowerCase();
    if (error && (message.includes("user_id") || message.includes("email") || message.includes("send_match_result_email"))) {
        const fallback = await supabaseClient
            .from("players")
            .insert([{ name }]);
        error = fallback.error;
    }

    if(error){
        console.error(error);
        return;
    }

    document.getElementById("newPlayer").value="";
    document.getElementById("newPlayerEmail").value="";
    document.getElementById("newPlayerSendEmail").checked=false;
    loadPlayers();
}

async function updatePlayer(id) {
    const user = await requireAuth();
    if (!user) return;
    currentUserId = user.id;
    currentIsAdmin = await hasAdminAccess(user);

    const name = document.getElementById(`player-name-${id}`)?.value.trim() || "";
    const email = document.getElementById(`player-email-${id}`)?.value.trim().toLowerCase() || "";
    const sendMail = Boolean(document.getElementById(`player-send-${id}`)?.checked);

    if (!name) {
        alert("Bitte einen Spielernamen eintragen.");
        return;
    }

    let updateQuery = supabaseClient
        .from("players")
        .update({
            name,
            email: email || null,
            send_match_result_email: sendMail
        })
        .eq("id", id);
    if (!currentIsAdmin) {
        updateQuery = updateQuery.eq("user_id", currentUserId);
    }

    let { error } = await updateQuery;
    const message = String(error?.message || "").toLowerCase();

    if (error && (message.includes("user_id") || message.includes("email") || message.includes("send_match_result_email"))) {
        const fallback = await supabaseClient
            .from("players")
            .update({ name })
            .eq("id", id);
        error = fallback.error;
    }

    if (error) {
        console.error(error);
        alert("Spieler konnte nicht gespeichert werden.");
        return;
    }

    await loadPlayers();
}

async function deletePlayer(id){
    const user = await requireAuth();
    if (!user) return;
    currentUserId = user.id;
    currentIsAdmin = await hasAdminAccess(user);

    if(!confirm("Spieler wirklich löschen?")) return;

    let deleteQuery = supabaseClient
        .from("players")
        .delete()
        .eq("id", id);
    if (!currentIsAdmin) {
        deleteQuery = deleteQuery.eq("user_id", currentUserId);
    }
    let { error } = await deleteQuery;

    // Fallback für altes Schema ohne user_id.
    if (error && String(error.message || "").toLowerCase().includes("user_id")) {
        const fallback = await supabaseClient
            .from("players")
            .delete()
            .eq("id", id);
        error = fallback.error;
    }

    if(error){
        console.error(error);
        return;
    }

    loadPlayers();
}

loadPlayers();

</script>
