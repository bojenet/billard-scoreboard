<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NBV Ranglisten</title>
    <style>
        :root {
            --bg: #f2efe7;
            --panel: #ffffff;
            --line: #cfd5dc;
            --text: #19202a;
            --muted: #647083;
            --head: #122033;
            --blue: #2d5880;
            --blue-deep: #214564;
            --soft: #f8f8f4;
            --ok: #157347;
            --error: #b42318;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        body {
            visibility: hidden;
        }

        body.page-ready {
            visibility: visible;
        }

        .page {
            width: min(1600px, 98%);
            margin: 0 auto;
            padding: 16px 0 32px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            padding: 12px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
            gap: 10px;
            align-items: end;
            margin-bottom: 14px;
        }

        .season-toolbar {
            display: grid;
            grid-template-columns: 180px minmax(0, 1fr) auto auto;
            gap: 10px;
            align-items: end;
            margin-bottom: 14px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field label {
            font-size: 12px;
            font-weight: 700;
            color: #475467;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #bcc6d2;
            border-radius: 4px;
            padding: 11px 12px;
            font-size: 14px;
            background: #fff;
            color: #10131c;
        }

        select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #bcc6d2;
            border-radius: 4px;
            padding: 11px 12px;
            font-size: 14px;
            background: #fff;
            color: #10131c;
        }

        .btn {
            min-height: 44px;
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: var(--blue);
            border-color: var(--blue-deep);
            color: #fff;
        }

        .btn-secondary {
            background: #667085;
            border-color: #566173;
        }

        .matches-list {
            display: grid;
            gap: 14px;
        }

        .tournament-meta {
            display: grid;
            gap: 6px;
            margin-bottom: 14px;
            padding: 2px 2px 6px;
        }

        .tournament-meta-row {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 10px;
            align-items: start;
            font-size: 14px;
            line-height: 1.4;
        }

        .tournament-meta-label {
            font-weight: 700;
            color: var(--muted);
        }

        .tournament-meta-value {
            color: var(--text);
        }

        .match-card {
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
        }

        .match-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #eef3f8;
            border-bottom: 1px solid #d8dee6;
        }

        .match-card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--head);
        }

        .match-card-sub {
            font-size: 12px;
            color: var(--muted);
            text-align: right;
        }

        .match-table-wrap {
            overflow-x: auto;
        }

        .match-table {
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
        }

        .match-table th,
        .match-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #d8dee6;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        .match-table th {
            background: #f8fafc;
            color: #344256;
            font-weight: 700;
            font-size: 12px;
        }

        .match-table tbody tr:last-child td {
            border-bottom: none;
        }

        .match-player-cell {
            font-weight: 700;
            color: var(--head);
            min-width: 210px;
        }

        .match-num-cell {
            width: 80px;
            white-space: nowrap;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .details-line {
            padding: 9px 12px 11px;
            border-top: 1px solid #e7ebf0;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        .ranking-block {
            margin-top: 18px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
        }

        .season-block {
            margin-top: 18px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
        }

        .warning-block {
            margin-top: 18px;
            border: 1px solid #f0c36d;
            border-radius: 6px;
            background: #fff9ef;
            overflow: hidden;
        }

        .warning-head {
            padding: 10px 12px;
            background: #fff1d6;
            border-bottom: 1px solid #f0d39a;
            font-size: 15px;
            font-weight: 700;
            color: #7a4b00;
        }

        .warning-list {
            margin: 0;
            padding: 12px 18px 14px 32px;
            color: #7a4b00;
            font-size: 14px;
            line-height: 1.5;
        }

        .warning-list li + li {
            margin-top: 8px;
        }

        .status-line {
            margin: 4px 0 14px;
            font-size: 13px;
            color: var(--muted);
        }

        .ranking-head {
            padding: 10px 12px;
            background: #eef3f8;
            border-bottom: 1px solid #d8dee6;
            font-size: 15px;
            font-weight: 700;
            color: var(--head);
        }

        .class-definition-line {
            padding: 8px 12px;
            border-bottom: 1px solid #d8dee6;
            background: #fbfcfd;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
            white-space: nowrap;
            overflow-x: auto;
        }

        .ranking-table-wrap {
            overflow-x: auto;
        }

        .ranking-table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
        }

        .ranking-table th,
        .ranking-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #d8dee6;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        .ranking-table th {
            background: #f8fafc;
            color: #344256;
            font-weight: 700;
            font-size: 12px;
        }

        .ranking-table th.sortable-header {
            cursor: pointer;
            user-select: none;
        }

        .sort-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .sort-arrow {
            color: #7a8699;
            font-size: 10px;
            line-height: 1;
        }

        .ranking-table tbody tr:last-child td {
            border-bottom: none;
        }

        .ranking-rank {
            width: 56px;
            font-weight: 700;
        }

        .ranking-name {
            font-weight: 700;
            color: var(--head);
            white-space: nowrap;
        }

        .ranking-num {
            width: 90px;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .ranking-current-class {
            background: #fff1d6;
            border-left: 2px solid #f59e0b;
            border-right: 2px solid #f59e0b;
            color: #7a3b00;
            font-weight: 800;
            text-align: center;
        }

        .ranking-table th.ranking-current-class {
            background: #ffd99a;
            border-top: 2px solid #f59e0b;
        }

        .ranking-table tbody tr:last-child td.ranking-current-class {
            border-bottom: 2px solid #f59e0b;
        }

        .ranking-links {
            width: 140px;
            max-width: 180px;
        }

        .mini-links {
            display: flex;
            flex-wrap: nowrap;
            gap: 4px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        .mini-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border: 1px solid #c7d2de;
            border-radius: 999px;
            background: #f8fafc;
            color: var(--blue-deep);
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;
        }

        .mini-link:hover {
            background: #eef3f8;
        }

        .mini-link.best-gd {
            background: #dff4e7;
            border-color: #7ac29a;
            color: #157347;
        }

        .btg-link {
            color: #157347;
            font-weight: 800;
            text-decoration: underline;
            text-underline-offset: 2px;
            white-space: nowrap;
        }

        .empty-state {
            border: 1px dashed #c5cfda;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.75);
            color: #59677a;
            padding: 18px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .page {
                width: min(96%, 96%);
            }

            .panel {
                padding: 14px;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }

            .season-toolbar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="panel">
            <div class="season-toolbar">
                <div class="field">
                    <label for="seasonInput">Saison</label>
                    <select id="seasonInput" onchange="loadSelectedRankingSnapshot().catch(handleSnapshotLoadError)">
                        <option value="2025/2026" selected>2025/2026</option>
                        <option value="2024/2025">2024/2025</option>
                        <option value="2023/2024">2023/2024</option>
                        <option value="2022/2023">2022/2023</option>
                        <option value="2021/2022">2021/2022</option>
                        <option value="2020/2021">2020/2021</option>
                        <option value="2019/2020">2019/2020</option>
                        <option value="2018/2019">2018/2019</option>
                        <option value="2017/2018">2017/2018</option>
                        <option value="2016/2017">2016/2017</option>
                        <option value="2015/2016">2015/2016</option>
                        <option value="2014/2015">2014/2015</option>
                        <option value="2013/2014">2013/2014</option>
                        <option value="2012/2013">2012/2013</option>
                        <option value="2011/2012">2011/2012</option>
                        <option value="2010/2011">2010/2011</option>
                        <option value="2009/2010">2009/2010</option>
                    </select>
                </div>
                <div class="field">
                    <label for="disciplineSelect">Disziplin</label>
                    <select id="disciplineSelect" onchange="loadSelectedRankingSnapshot().catch(handleSnapshotLoadError)">
                        <option value="36">Billard Kegeln</option>
                        <option value="56">Biathlon</option>
                        <option value="9">Cadre 35/2</option>
                        <option value="10">Cadre 47/2</option>
                        <option value="11" selected>Cadre 52/2</option>
                        <option value="12">Cadre 71/2</option>
                        <option value="5">Dreiband (großes Billard)</option>
                        <option value="6">Dreiband (kleines Billard)</option>
                        <option value="14">Einband (großes Billard)</option>
                        <option value="13">Einband (kleines Billard)</option>
                        <option value="31">Eurokegel</option>
                        <option value="7">Freie Partie (großes Billard)</option>
                        <option value="8">Freie Partie (kleines Billard)</option>
                    </select>
                </div>
                <button id="refreshRankingBtn" class="btn" type="button" onclick="refreshSeasonRanking()">Aktualisieren</button>
                <button id="exportRankingBtn" class="btn btn-secondary" type="button" onclick="exportRankingWorkbook()">Excel Export</button>
            </div>
            <div id="statusLine" class="status-line"></div>
            <div id="resultsWrap">
                <div class="empty-state">Saison auswählen.</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/calendar_access.js"></script>
    <script src="/js/user_menu.js"></script>
    <script>
        const RANKING_SNAPSHOT_TABLE = "nbv_ranking_snapshots";
        const NBV_DISCIPLINES = {
            "36": "Billard Kegeln",
            "56": "Biathlon",
            "9": "Cadre 35/2",
            "10": "Cadre 47/2",
            "11": "Cadre 52/2",
            "12": "Cadre 71/2",
            "5": "Dreiband (großes Billard)",
            "6": "Dreiband (kleines Billard)",
            "14": "Einband (großes Billard)",
            "13": "Einband (kleines Billard)",
            "31": "Eurokegel",
            "7": "Freie Partie (großes Billard)",
            "8": "Freie Partie (kleines Billard)",
        };
        const RANKING_EXPORT_DISCIPLINE_IDS = ["9", "10", "11", "12", "7", "8", "14", "13", "5", "6"];
        let currentUser = null;
        let canRefreshRankings = false;
        let activeBtdReference = null;

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleDateString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
            });
        }

        async function getFunctionErrorMessage(error) {
            if (!error) return "Unbekannter Fehler";
            if (error.message && !/non-2xx status code/i.test(String(error.message))) {
                return String(error.message);
            }
            const context = error.context;
            if (context && typeof context.text === "function") {
                try {
                    const raw = await context.text();
                    if (raw) {
                        try {
                            const parsed = JSON.parse(raw);
                            return parsed?.message || parsed?.error || raw;
                        } catch (_) {
                            return raw;
                        }
                    }
                } catch (_) {
                    return String(error.message || "Unbekannter Fehler");
                }
            }
            return String(error.message || "Unbekannter Fehler");
        }

        function setStatus(text) {
            const el = document.getElementById("statusLine");
            if (!el) return;
            el.textContent = text || "";
        }

        function getLastCompletedSeason(today = new Date()) {
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const activeSeasonStart = month >= 8 ? year : year - 1;
            const lastSeasonStart = activeSeasonStart - 1;
            return `${lastSeasonStart}/${lastSeasonStart + 1}`;
        }

        function setSelectValue(selectId, value) {
            const select = document.getElementById(selectId);
            if (!select || !value) return;
            const normalizedValue = String(value);
            const hasOption = Array.from(select.options).some((option) => option.value === normalizedValue);
            if (!hasOption) {
                select.add(new Option(normalizedValue, normalizedValue));
            }
            select.value = normalizedValue;
        }

        function getSelectedSeason() {
            return normalizeSeasonInput(String(document.getElementById("seasonInput")?.value || "").trim());
        }

        function getSelectedDisciplineId() {
            return String(document.getElementById("disciplineSelect")?.value || "").trim();
        }

        function getSelectedDisciplineLabel() {
            return NBV_DISCIPLINES[getSelectedDisciplineId()] || "Disziplin";
        }

        function formatDateTime(value) {
            if (!value) return "";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "";
            return date.toLocaleString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
            });
        }

        function applyRankingAccessUi() {
            const button = document.getElementById("refreshRankingBtn");
            if (!button) return;
            button.style.display = canRefreshRankings ? "" : "none";
        }

        function buildDetails(details) {
            const list = Array.isArray(details)
                ? details.filter((entry) => entry && entry.value && !(entry.label === "Phase" && entry.value === "Ergebnisse"))
                : [];
            if (!list.length) return "";
            return list.map((entry) => `${escapeHtml(entry.label)}: ${escapeHtml(entry.value)}`).join(" · ");
        }

        function buildMetaBlock(meta) {
            const rows = [
                { label: "Turnier", value: meta?.title || "-" },
                { label: "Kürzel", value: meta?.shortCode || "-" },
                { label: "Datum", value: meta?.date ? formatDate(meta.date) : "-" },
                { label: "Spielbeginn", value: meta?.startTime ? `${formatDate(meta.date)} um ${meta.startTime} Uhr` : "-" },
                { label: "Location", value: meta?.location || "-" },
            ];

            return `
                <section class="tournament-meta">
                    ${rows.map((row) => `
                        <div class="tournament-meta-row">
                            <div class="tournament-meta-label">${escapeHtml(row.label)}</div>
                            <div class="tournament-meta-value">${escapeHtml(row.value)}</div>
                        </div>
                    `).join("")}
                </section>
            `;
        }

        function buildTournamentSection(data) {
            const rows = Array.isArray(data?.matches) ? data.matches : [];
            return `
                <section class="ranking-block">
                    <div class="ranking-head">${escapeHtml(data?.meta?.title || "Turnier")}</div>
                    ${buildMetaBlock(data?.meta || {})}
                    <div class="matches-list">
                        ${rows.map((row) => buildMatchCard(row)).join("")}
                    </div>
                    ${buildRanking(rows)}
                </section>
            `;
        }

        function buildMatchCard(row) {
            const title = row.phaseLabel
                ? `${row.phaseLabel} · Partie ${row.matchNo || "-"} · ${row.score || "-"}`
                : `Partie ${row.matchNo || "-"} · ${row.score || "-"}`;
            const plan = [formatDate(row.scheduledDate), row.scheduledTime || ""].filter((value) => value && value !== "-").join(" · ");
            return `
                <section class="match-card">
                    <div class="match-card-head">
                        <div class="match-card-title">${escapeHtml(title)}</div>
                        <div class="match-card-sub">${escapeHtml(plan || "-")}</div>
                    </div>
                    <div class="match-table-wrap">
                        <table class="match-table">
                            <thead>
                                <tr>
                                    <th>Spieler</th>
                                    <th>Bälle</th>
                                    <th>Punkte</th>
                                    <th>Aufn.</th>
                                    <th>Ø</th>
                                    <th>HS</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="match-player-cell">${escapeHtml(row.player1?.name || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.balls || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.points || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.innings || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.average || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.hs || "-")}</td>
                                </tr>
                                <tr>
                                    <td class="match-player-cell">${escapeHtml(row.player2?.name || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.balls || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.points || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.innings || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.average || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.hs || "-")}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    ${buildDetails(row.details) ? `<div class="details-line">${buildDetails(row.details)}</div>` : ""}
                </section>
            `;
        }

        function toNumber(value) {
            const normalized = String(value || "").replace(",", ".").trim();
            const parsed = Number(normalized);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function normalizePlayerLookupKey(value) {
            return String(value || "")
                .trim()
                .toLowerCase()
                .replace(/ä/g, "ae")
                .replace(/ö/g, "oe")
                .replace(/ü/g, "ue")
                .replace(/ß/g, "ss")
                .replace(/[^a-z0-9]+/g, " ")
                .trim();
        }

        function getMatchWinner(match) {
            const left = toNumber(match?.player1?.balls);
            const right = toNumber(match?.player2?.balls);
            if (left > right) return "player1";
            if (right > left) return "player2";
            return "draw";
        }

        function getMatchLoser(match) {
            const winner = getMatchWinner(match);
            if (winner === "player1") return "player2";
            if (winner === "player2") return "player1";
            return "draw";
        }

        function parsePlacementLabel(label) {
            const normalized = String(label || "");
            const match = normalized.match(/platz\s+(\d+)/i);
            return match ? Number(match[1]) : 0;
        }

        function getPhasePriority(phaseType) {
            switch (phaseType) {
                case "final":
                    return 1;
                case "semifinal":
                    return 3;
                case "quarterfinal":
                    return 5;
                case "round_of_16":
                    return 9;
                case "knockout":
                    return 20;
                case "intermediate_round":
                    return 30;
                case "preliminary_round":
                    return 40;
                case "group":
                    return 50;
                default:
                    return 60;
            }
        }

        function getEliminationPlacement(phaseType) {
            switch (phaseType) {
                case "semifinal":
                    return 3;
                case "quarterfinal":
                    return 5;
                case "round_of_16":
                    return 9;
                default:
                    return null;
            }
        }

        function formatAverage(value) {
            if (!Number.isFinite(value)) return "-";
            const truncated = Math.trunc(value * 1000) / 1000;
            return truncated.toLocaleString("de-DE", {
                minimumFractionDigits: 3,
                maximumFractionDigits: 3,
            });
        }

        function formatAverageOrBlank(value) {
            return Number.isFinite(value) && value > 0 ? formatAverage(value) : "";
        }

        function buildBestTournamentAverageLink(row) {
            const value = formatAverageOrBlank(row.bestTournamentAverage);
            if (!value) return "";
            if (row.btdReferenceUrl) {
                return `<a class="btg-link" href="${escapeHtml(row.btdReferenceUrl)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(`NDBV-BTD ${value}`)}">${escapeHtml(value)}</a>`;
            }
            const bestLink = Array.isArray(row.links)
                ? row.links.find((link) => link.isBestAverage && link.url)
                : null;
            if (!bestLink) return escapeHtml(value);
            return `<a class="btg-link" href="${escapeHtml(bestLink.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(`${bestLink.title} · Turnierschnitt ${value}`)}">${escapeHtml(value)}</a>`;
        }

        function formatIntegerOrBlank(value) {
            return Number.isFinite(value) && value > 0
                ? value.toLocaleString("de-DE", { maximumFractionDigits: 0 })
                : "";
        }

        function normalizeSeasonInput(value) {
            const match = String(value || "").trim().match(/^(\d{4})\s*\/\s*(\d{2}|\d{4})$/);
            if (!match) return "";
            const startYear = Number(match[1]);
            const endYear = match[2].length === 2
                ? Number(`${String(startYear).slice(0, 2)}${match[2]}`)
                : Number(match[2]);
            if (!Number.isFinite(startYear) || !Number.isFinite(endYear) || endYear !== startYear + 1) {
                return "";
            }
            return `${startYear}/${endYear}`;
        }

        function buildSeasonHistory(season, count = 3) {
            const normalized = normalizeSeasonInput(season);
            if (!normalized) return [];
            const [startRaw, endRaw] = normalized.split("/");
            const start = Number(startRaw);
            const end = Number(endRaw);
            return Array.from({ length: count }, (_entry, index) => `${start - index}/${end - index}`);
        }

        function formatSeasonShortLabel(season) {
            const parts = String(season || "").split("/");
            if (parts.length !== 2) return season;
            return `${parts[0].slice(-2)}/${parts[1].slice(-2)}`;
        }

            };

            return classThresholds[normalizedDisciplineId] || [];
        }

        function formatBtgThreshold(value) {
            return Number(value).toLocaleString("de-DE", {
                minimumFractionDigits: 3,
                maximumFractionDigits: 3,
            });
        }

        function buildClassDefinitionLine(disciplineId) {
            const thresholds = getClassThresholds(disciplineId);
            if (!thresholds.length) return "";
            return thresholds
                .map((entry) => `Klasse ${entry.className}: BTG ab ${formatBtgThreshold(entry.min)}`)
                .join(", ");
        }

        function determineEarnedClass(disciplineId, bestTournamentAverage) {
            if (!Number.isFinite(bestTournamentAverage) || bestTournamentAverage <= 0) {
                return "";
            }

            const thresholds = getClassThresholds(disciplineId);
            return thresholds.find((entry) => bestTournamentAverage >= entry.min)?.className || "";
        }

        function simplifyClubLabel(value) {
            const normalized = String(value || "")
                .trim()
                .toLowerCase()
                .replace(/ä/g, "ae")
                .replace(/ö/g, "oe")
                .replace(/ü/g, "ue")
                .replace(/ß/g, "ss")
                .replace(/[^a-z0-9]+/g, "");
            const clubLabels = {
                bghamburg: "BGH",
                bcwedel: "BCW",
                bcwedel61: "BCW",
                bcqueuehamburg: "BC Queue",
                tsvnordhastedt: "TSVNB",

            };
            return clubLabels[normalized] || String(value || "").trim();
        }

        function pickPlayerClub(name, ...summaries) {
            for (const summary of summaries) {
                const club = simplifyClubLabel(summary?.club || "");
                if (club) return club;
            }
            return inferClubFromPlayerName(name);
        }

        function createSeasonPlayerSummary(tournaments, disciplineId, includeLinks = false) {
            const playerMap = new Map();

            tournaments.forEach((tournament, tournamentIndex) => {
                const rows = Array.isArray(tournament?.matches) ? tournament.matches : [];
                const tournamentPlayerMap = new Map();
                const tournamentTitle = String(tournament?.meta?.title || `Turnier ${tournamentIndex + 1}`).trim();
                const tournamentUrl = String(tournament?.sourceUrl || "").trim();
                const tournamentShortCode = String(tournament?.meta?.shortCode || "").trim() || `T${tournamentIndex + 1}`;

                rows.forEach((match) => {
                    [match.player1, match.player2].forEach((player) => {
                        const name = String(player?.name || "").trim();
                        if (!name) return;
                        const current = tournamentPlayerMap.get(name) || {
                            name,
                            club: String(player?.club || "").trim(),
                            balls: 0,
                            innings: 0,
                            hs: 0,
                        };
                        if (!current.club && player?.club) current.club = String(player.club || "").trim();
                        current.balls += toNumber(player.balls);
                        current.innings += toNumber(player.innings);
                        current.hs = Math.max(current.hs, toNumber(player.hs));
                        tournamentPlayerMap.set(name, current);
                    });
                });

                Array.from(tournamentPlayerMap.values()).forEach((entry) => {
                    const playerSummary = playerMap.get(entry.name) || {
                        name: entry.name,
                        club: entry.club || inferClubFromPlayerName(entry.name),
                        totalBalls: 0,
                        totalInnings: 0,
                        bestTournamentAverage: 0,
                        bestHs: 0,
                        links: [],
                        earnedClass: "",
                    };
                    const tournamentAverage = entry.innings > 0 ? entry.balls / entry.innings : 0;
                    if (!playerSummary.club && entry.club) playerSummary.club = entry.club;
                    playerSummary.totalBalls += entry.balls;
                    playerSummary.totalInnings += entry.innings;
                    playerSummary.bestTournamentAverage = Math.max(playerSummary.bestTournamentAverage, tournamentAverage);
                    playerSummary.bestHs = Math.max(playerSummary.bestHs, entry.hs);
                    if (includeLinks) {
                        playerSummary.links.push({
                            label: tournamentShortCode,
                            title: tournamentTitle,
                            url: tournamentUrl,
                            average: tournamentAverage,
                        });
                    }
                    playerMap.set(entry.name, playerSummary);
                });
            });

            Array.from(playerMap.values()).forEach((entry) => {
                entry.earnedClass = determineEarnedClass(disciplineId, entry.bestTournamentAverage);
            });

            return playerMap;
        }

        function buildRanking(rows) {
            const playerMap = new Map();

            rows.forEach((match) => {
                const pairs = [
                    { player: match.player1, opponent: match.player2 },
                    { player: match.player2, opponent: match.player1 },
                ];
                pairs.forEach(({ player, opponent }) => {
                    const name = String(player?.name || "").trim();
                    if (!name) return;
                    const current = playerMap.get(name) || {
                        name,
                        mp: 0,
                        setsFor: 0,
                        setsAgainst: 0,
                        balls: 0,
                        innings: 0,
                        matches: 0,
                        bestAverage: 0,
                        hs: 0,
                        exactPlace: null,
                        phasePriority: 999,
                        eliminatedAt: "",
                    };
                    current.mp += toNumber(player.points);
                    current.setsFor += toNumber(player.points);
                    current.setsAgainst += toNumber(opponent?.points);
                    current.balls += toNumber(player.balls);
                    current.innings += toNumber(player.innings);
                    current.matches += 1;
                    current.bestAverage = Math.max(current.bestAverage, toNumber(player.average));
                    current.hs = Math.max(current.hs, toNumber(player.hs));
                    playerMap.set(name, current);
                });
            });

            rows.forEach((match) => {
                const p1Name = String(match?.player1?.name || "").trim();
                const p2Name = String(match?.player2?.name || "").trim();
                if (!p1Name || !p2Name) return;

                const winnerSide = getMatchWinner(match);
                const loserSide = getMatchLoser(match);
                const winnerName = winnerSide === "player1" ? p1Name : winnerSide === "player2" ? p2Name : "";
                const loserName = loserSide === "player1" ? p1Name : loserSide === "player2" ? p2Name : "";
                const phaseType = String(match?.phaseType || "");
                const phaseLabel = String(match?.phaseLabel || "");

                if (phaseType === "final") {
                    if (winnerName && playerMap.has(winnerName)) {
                        playerMap.get(winnerName).exactPlace = 1;
                        playerMap.get(winnerName).phasePriority = 1;
                    }
                    if (loserName && playerMap.has(loserName)) {
                        playerMap.get(loserName).exactPlace = 2;
                        playerMap.get(loserName).phasePriority = 2;
                    }
                    return;
                }

                if (phaseType === "placement") {
                    const placement = parsePlacementLabel(phaseLabel);
                    if (placement > 0) {
                        if (winnerName && playerMap.has(winnerName)) {
                            playerMap.get(winnerName).exactPlace = placement;
                            playerMap.get(winnerName).phasePriority = Math.min(playerMap.get(winnerName).phasePriority, placement);
                        }
                        if (loserName && playerMap.has(loserName)) {
                            playerMap.get(loserName).exactPlace = placement + 1;
                            playerMap.get(loserName).phasePriority = Math.min(playerMap.get(loserName).phasePriority, placement + 1);
                        }
                    }
                    return;
                }

                const eliminationPlacement = getEliminationPlacement(phaseType);
                if (eliminationPlacement !== null && loserName && playerMap.has(loserName)) {
                    const loser = playerMap.get(loserName);
                    if (loser.exactPlace === null) {
                        loser.exactPlace = eliminationPlacement;
                    }
                    loser.eliminatedAt = phaseType;
                }

                const priority = getPhasePriority(phaseType);
                if (winnerName && playerMap.has(winnerName)) {
                    playerMap.get(winnerName).phasePriority = Math.min(playerMap.get(winnerName).phasePriority, Math.max(0, priority - 1));
                }
                if (loserName && playerMap.has(loserName)) {
                    playerMap.get(loserName).phasePriority = Math.min(playerMap.get(loserName).phasePriority, priority);
                }
            });

            const ranking = Array.from(playerMap.values())
                .map((entry) => ({
                    ...entry,
                    gd: entry.innings > 0 ? entry.balls / entry.innings : 0,
                    bed: entry.bestAverage,
                    setPercent: entry.setsFor + entry.setsAgainst > 0
                        ? (entry.setsFor / (entry.setsFor + entry.setsAgainst)) * 100
                        : 0,
                }));

            const compareCompetitive = (left, right) => {
                if (left.phasePriority !== right.phasePriority) return left.phasePriority - right.phasePriority;
                if (right.mp !== left.mp) return right.mp - left.mp;
                if (right.setPercent !== left.setPercent) return right.setPercent - left.setPercent;
                if (right.balls !== left.balls) return right.balls - left.balls;
                if (right.gd !== left.gd) return right.gd - left.gd;
                if (right.bed !== left.bed) return right.bed - left.bed;
                if (right.hs !== left.hs) return right.hs - left.hs;
                return left.name.localeCompare(right.name, "de");
            };

            const fixedPlaces = ranking
                .filter((entry) => entry.exactPlace !== null)
                .sort((left, right) => {
                    if (left.exactPlace !== right.exactPlace) return left.exactPlace - right.exactPlace;
                    return compareCompetitive(left, right);
                });

            const unresolved = ranking
                .filter((entry) => entry.exactPlace === null)
                .sort(compareCompetitive);

            const usedPlaces = new Set(fixedPlaces.map((entry) => entry.exactPlace));
            let nextPlace = 1;
            unresolved.forEach((entry) => {
                while (usedPlaces.has(nextPlace)) {
                    nextPlace += 1;
                }
                entry.exactPlace = nextPlace;
                usedPlaces.add(nextPlace);
                nextPlace += 1;
            });

            const finalRanking = [...fixedPlaces, ...unresolved]
                .sort((left, right) => {
                    if (left.exactPlace !== right.exactPlace) return left.exactPlace - right.exactPlace;
                    return compareCompetitive(left, right);
                })
                .map((entry) => ({
                    ...entry,
                    displayPlace: entry.exactPlace,
                }));

            if (!finalRanking.length) {
                return "";
            }

            return `
                <section class="ranking-block">
                    <div class="ranking-head">Turnier-Rangliste</div>
                    <div class="ranking-table-wrap">
                        <table class="ranking-table">
                            <thead>
                                <tr>
                                    <th class="ranking-rank">Rang</th>
                                    <th>Spieler</th>
                                    <th class="ranking-num">MP</th>
                                    <th class="ranking-num">Sätze</th>
                                    <th class="ranking-num">Punkte</th>
                                    <th class="ranking-num">Aufn.</th>
                                    <th class="ranking-num">GD</th>
                                    <th class="ranking-num">BED</th>
                                    <th class="ranking-num">HS</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${finalRanking.map((row) => `
                                    <tr>
                                        <td class="ranking-rank">${escapeHtml(row.displayPlace)}</td>
                                        <td class="ranking-name">${escapeHtml(row.name)}</td>
                                        <td class="ranking-num">${escapeHtml(row.mp)}</td>
                                        <td class="ranking-num">${escapeHtml(`${row.setsFor}:${row.setsAgainst}`)}</td>
                                        <td class="ranking-num">${escapeHtml(row.balls)}</td>
                                        <td class="ranking-num">${escapeHtml(row.innings)}</td>
                                        <td class="ranking-num">${escapeHtml(formatAverage(row.gd))}</td>
                                        <td class="ranking-num">${escapeHtml(formatAverage(row.bed))}</td>
                                        <td class="ranking-num">${escapeHtml(row.hs)}</td>
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                </section>
            `;
        }

        function buildSeasonRanking(seasonBundles, disciplineId = "") {
            const bundles = Array.isArray(seasonBundles) ? seasonBundles.filter((entry) => entry?.season) : [];
            if (!bundles.length) return "";

            const [currentBundle, previousBundle1, previousBundle2] = bundles;
            const currentSeason = currentBundle?.season || "";
            const previousSeason1 = previousBundle1?.season || "";
            const previousSeason2 = previousBundle2?.season || "";
            const currentShort = formatSeasonShortLabel(currentSeason);
            const previousShort1 = formatSeasonShortLabel(previousSeason1);
            const previousShort2 = formatSeasonShortLabel(previousSeason2);
            const btdByPlayer = activeBtdReference
                && activeBtdReference.season === currentSeason
                && String(activeBtdReference.disciplineId) === String(disciplineId)
                ? activeBtdReference.byPlayer
                : new Map();

            const currentMap = createSeasonPlayerSummary(currentBundle?.tournaments || [], disciplineId, true);
            const previousMap1 = createSeasonPlayerSummary(previousBundle1?.tournaments || [], disciplineId, false);
            const previousMap2 = createSeasonPlayerSummary(previousBundle2?.tournaments || [], disciplineId, false);
            const playerNames = new Set([
                ...currentMap.keys(),
                ...previousMap1.keys(),
                ...previousMap2.keys(),
            ]);
            btdByPlayer.forEach((entry) => {
                const name = String(entry?.name || "").trim();
                if (name) playerNames.add(name);
            });

            const ranking = Array.from(playerNames.values())
                .map((name) => {
                    const current = currentMap.get(name) || {
                        club: btdByPlayer.get(normalizePlayerLookupKey(name))?.club || inferClubFromPlayerName(name),
                        totalBalls: 0,
                        totalInnings: 0,
                        bestTournamentAverage: 0,
                        bestHs: 0,
                        links: [],
                        earnedClass: "",
                    };
                    const prev1 = previousMap1.get(name) || {
                        club: "",
                        totalBalls: 0,
                        totalInnings: 0,
                        bestTournamentAverage: 0,
                        earnedClass: "",
                    };
                    const prev2 = previousMap2.get(name) || {
                        club: "",
                        totalBalls: 0,
                        totalInnings: 0,
                        bestTournamentAverage: 0,
                        earnedClass: "",
                    };
                    const currentBestTournamentAverage = current.bestTournamentAverage || 0;
                    const previousBestTournamentAverage1 = prev1.bestTournamentAverage || 0;
                    const previousBestTournamentAverage2 = prev2.bestTournamentAverage || 0;
                    const btdReference = btdByPlayer.get(normalizePlayerLookupKey(name));
                    const referenceTotalBalls = Number(btdReference?.totalBalls || 0);
                    const referenceTotalInnings = Number(btdReference?.totalInnings || 0);
                    const displayTotalBalls = referenceTotalBalls > 0 ? referenceTotalBalls : (current.totalBalls || 0);
                    const displayTotalInnings = referenceTotalInnings > 0 ? referenceTotalInnings : (current.totalInnings || 0);
                    const displayBestTournamentAverage = Number.isFinite(btdReference?.valueNumber)
                        ? btdReference.valueNumber
                        : currentBestTournamentAverage;
                    const effectiveBestTournamentAverage = Math.max(
                        displayBestTournamentAverage,
                        previousBestTournamentAverage1,
                        previousBestTournamentAverage2,
                    );

                    return {
                        name,
                        club: pickPlayerClub(name, current, btdReference, prev1, prev2),
                        totalBalls: displayTotalBalls,
                        totalInnings: displayTotalInnings,
                        totalAverage: displayTotalInnings > 0 ? displayTotalBalls / displayTotalInnings : 0,
                        bestTournamentAverage: displayBestTournamentAverage,
                        btdReferenceUrl: btdReference?.url || "",
                        bestHs: current.bestHs || 0,
                        currentClass: determineEarnedClass(disciplineId, displayBestTournamentAverage),
                        effectiveClass: determineEarnedClass(disciplineId, effectiveBestTournamentAverage),
                        previousAverage1: prev1.totalInnings > 0 ? prev1.totalBalls / prev1.totalInnings : 0,
                        previousClass1: prev1.earnedClass || "",
                        previousAverage2: prev2.totalInnings > 0 ? prev2.totalBalls / prev2.totalInnings : 0,
                        previousClass2: prev2.earnedClass || "",
                        links: (current.links || []).map((link) => ({
                            ...link,
                            isBestAverage: Math.abs((link.average || 0) - (current.bestTournamentAverage || 0)) < 0.000001,
                        })),
                    };
                })
                .sort((left, right) => {
                    if (right.totalAverage !== left.totalAverage) return right.totalAverage - left.totalAverage;
                    if (right.bestTournamentAverage !== left.bestTournamentAverage) return right.bestTournamentAverage - left.bestTournamentAverage;
                    if (right.previousAverage1 !== left.previousAverage1) return right.previousAverage1 - left.previousAverage1;
                    if (right.previousAverage2 !== left.previousAverage2) return right.previousAverage2 - left.previousAverage2;
                    if (right.bestHs !== left.bestHs) return right.bestHs - left.bestHs;
                    return left.name.localeCompare(right.name, "de");
                });

            if (!ranking.length) return "";
            const classDefinitionLine = buildClassDefinitionLine(disciplineId);
            const disciplineLabel = NBV_DISCIPLINES[String(disciplineId || "").trim()] || "";

            return `
                <section class="season-block">
                    <div class="ranking-head">Gesamtrangliste${disciplineLabel ? ` - ${escapeHtml(disciplineLabel)}` : ""}</div>
                    ${classDefinitionLine ? `<div class="class-definition-line">${escapeHtml(classDefinitionLine)}</div>` : ""}
                    <div class="ranking-table-wrap">
                        <table class="ranking-table">
                            <thead>
                                <tr>
                                    <th class="ranking-rank">Rang</th>
                                    <th>Spieler</th>
                                    <th>Verein</th>
                                    <th class="ranking-num">Bälle</th>
                                    <th class="ranking-num">Aufn.</th>
                                    <th class="ranking-num">GD ${escapeHtml(currentShort)}</th>
                                    <th class="ranking-num">BTG ${escapeHtml(currentShort)}</th>
                                    <th class="ranking-num">HS ${escapeHtml(currentShort)}</th>
                                    <th class="ranking-num">Klasse ${escapeHtml(currentShort)}</th>
                                    <th class="ranking-num">GD ${escapeHtml(previousShort1)}</th>
                                    <th class="ranking-num">Klasse ${escapeHtml(previousShort1)}</th>
                                    <th class="ranking-num">GD ${escapeHtml(previousShort2)}</th>
                                    <th class="ranking-num">Klasse ${escapeHtml(previousShort2)}</th>
                                    <th class="ranking-num ranking-current-class">Klasse aktuell</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${ranking.map((row, index) => `
                                    <tr>
                                        <td class="ranking-rank">${escapeHtml(index + 1)}</td>
                                        <td class="ranking-name">${escapeHtml(row.name)}</td>
                                        <td>${escapeHtml(row.club || "")}</td>
                                        <td class="ranking-num">${escapeHtml(formatIntegerOrBlank(row.totalBalls))}</td>
                                        <td class="ranking-num">${escapeHtml(formatIntegerOrBlank(row.totalInnings))}</td>
                                        <td class="ranking-num">${escapeHtml(formatAverageOrBlank(row.totalAverage))}</td>
                                        <td class="ranking-num">${buildBestTournamentAverageLink(row)}</td>
                                        <td class="ranking-num">${escapeHtml(formatIntegerOrBlank(row.bestHs))}</td>
                                        <td class="ranking-num">${escapeHtml(row.currentClass || "")}</td>
                                        <td class="ranking-num">${escapeHtml(formatAverageOrBlank(row.previousAverage1))}</td>
                                        <td class="ranking-num">${escapeHtml(row.previousClass1 || "")}</td>
                                        <td class="ranking-num">${escapeHtml(formatAverageOrBlank(row.previousAverage2))}</td>
                                        <td class="ranking-num">${escapeHtml(row.previousClass2 || "")}</td>
                                        <td class="ranking-num ranking-current-class">${escapeHtml(row.effectiveClass || "")}</td>
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                </section>
            `;
        }

        function buildFailedBlock(failed) {
            const items = Array.isArray(failed) ? failed.filter(Boolean) : [];
            if (!items.length) return "";
            return `
                <section class="warning-block">
                    <div class="warning-head">Übersprungene Turniere</div>
                    <ul class="warning-list">
                        ${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
                    </ul>
                </section>
            `;
        }

        function renderResults(tournaments, failed = []) {
            const wrap = document.getElementById("resultsWrap");
            if (!wrap) return;
            const disciplineId = String(document.getElementById("disciplineSelect")?.value || "").trim();

            const validTournaments = Array.isArray(tournaments)
                ? tournaments.filter((entry) => Array.isArray(entry?.matches) && entry.matches.length)
                : [];

            if (!validTournaments.length) {
                wrap.innerHTML = '<div class="empty-state">Keine Begegnungen gefunden.</div>';
                return;
            }

            wrap.innerHTML = `
                ${validTournaments.map((tournament) => buildTournamentSection(tournament)).join("")}
                ${buildSeasonRanking([{
                    season: String(validTournaments[0]?.meta?.season || document.getElementById("seasonInput")?.value || "").trim(),
                    tournaments: validTournaments,
                }], disciplineId)}
                ${buildFailedBlock(failed)}
            `;
            enhanceRankingTables(wrap);
        }

        function buildSeasonResultsHtml(seasonBundles, failed = [], disciplineId = "") {
            const selectedDisciplineId = String(disciplineId || getSelectedDisciplineId()).trim();

            const validSeasonBundles = Array.isArray(seasonBundles)
                ? seasonBundles.filter((entry) => Array.isArray(entry?.tournaments) && entry.tournaments.length)
                : [];

            if (!validSeasonBundles.length) {
                return '<div class="empty-state">Keine Begegnungen gefunden.</div>';
            }

            return `
                ${buildSeasonRanking(validSeasonBundles, selectedDisciplineId)}
                ${buildFailedBlock(failed)}
            `;
        }

        function renderSeasonResults(seasonBundles, failed = []) {
            const wrap = document.getElementById("resultsWrap");
            if (!wrap) return "";
            const html = buildSeasonResultsHtml(seasonBundles, failed);
            wrap.innerHTML = html;
            enhanceRankingTables(wrap);
            return html;
        }

        function parseSortableValue(cell) {
            const text = String(cell?.textContent || "").replace(/\s+/g, " ").trim();
            if (!text) return { type: "empty", value: "" };
            const numericCandidate = text
                .replace(/\./g, "")
                .replace(",", ".")
                .replace(/[^0-9.+-]/g, "");
            if (/^[+-]?\d+(?:\.\d+)?$/.test(numericCandidate)) {
                return { type: "number", value: Number(numericCandidate) };
            }
            return { type: "text", value: text.toLocaleLowerCase("de-DE") };
        }

        function compareSortableCells(leftCell, rightCell, direction) {
            const left = parseSortableValue(leftCell);
            const right = parseSortableValue(rightCell);
            if (left.type === "empty" && right.type !== "empty") return 1;
            if (right.type === "empty" && left.type !== "empty") return -1;
            if (left.type === "number" && right.type === "number") {
                return direction * (left.value - right.value);
            }
            return direction * String(left.value).localeCompare(String(right.value), "de", {
                numeric: true,
                sensitivity: "base",
            });
        }

        function sortRankingTable(table, columnIndex, direction) {
            const tbody = table.querySelector("tbody");
            if (!tbody) return;
            const rows = Array.from(tbody.querySelectorAll("tr"));
            rows.sort((leftRow, rightRow) => {
                const compared = compareSortableCells(leftRow.cells[columnIndex], rightRow.cells[columnIndex], direction);
                if (compared !== 0) return compared;
                return compareSortableCells(leftRow.cells[1], rightRow.cells[1], 1);
            });
            rows.forEach((row) => tbody.appendChild(row));
        }

        function updateSortArrows(table, activeHeader, direction) {
            table.querySelectorAll("th.sortable-header").forEach((header) => {
                const arrow = header.querySelector(".sort-arrow");
                if (!arrow) return;
                arrow.textContent = header === activeHeader
                    ? (direction === 1 ? "▲" : "▼")
                    : "↕";
            });
        }

        function enhanceRankingTables(root = document) {
            root.querySelectorAll(".ranking-table").forEach((table) => {
                const headers = Array.from(table.querySelectorAll("thead th"));
                headers.forEach((header, index) => {
                    if (header.dataset.sortReady === "1") return;
                    const label = String(header.textContent || "").replace(/\s+/g, " ").trim();
                    header.dataset.sortReady = "1";
                    header.dataset.sortDirection = "";
                    header.classList.add("sortable-header");
                    header.innerHTML = `<span class="sort-label">${escapeHtml(label)} <span class="sort-arrow">↕</span></span>`;
                    header.addEventListener("click", () => {
                        const nextDirection = header.dataset.sortDirection === "asc" ? -1 : 1;
                        headers.forEach((entry) => {
                            entry.dataset.sortDirection = "";
                        });
                        header.dataset.sortDirection = nextDirection === 1 ? "asc" : "desc";
                        sortRankingTable(table, index, nextDirection);
                        updateSortArrows(table, header, nextDirection);
                    });
                });
            });
        }

        function getLoadedTournamentCount(seasonBundles) {
            return Array.isArray(seasonBundles)
                ? seasonBundles.reduce((sum, bundle) => sum + (bundle.tournaments?.length || 0), 0)
                : 0;
        }

        async function loadSelectedRankingSnapshot() {
            const season = getSelectedSeason();
            const disciplineId = getSelectedDisciplineId();
            if (!season || !disciplineId) return null;

            setStatus("Gespeicherte Rangliste wird geladen...");
            const { data, error } = await supabaseClient
                .from(RANKING_SNAPSHOT_TABLE)
                .select("season,discipline_id,discipline_label,payload,loaded_tournament_count,failed_count,updated_at,updated_by_name")
                .eq("season", season)
                .eq("discipline_id", disciplineId)
                .maybeSingle();

            if (error) throw error;
            if (!data) {
                document.getElementById("resultsWrap").innerHTML = '<div class="empty-state">Für diese Saison und Disziplin ist noch keine gespeicherte Rangliste vorhanden.</div>';
                setStatus(canRefreshRankings ? "Mit Aktualisieren einmal laden und zentral speichern." : "Noch nicht zentral geladen.");
                return null;
            }

            renderRankingSnapshot(data);
            return data;
        }

        async function loadLatestSeasonSnapshot() {
            const lastSeason = getLastCompletedSeason();
            setSelectValue("seasonInput", lastSeason);
            setStatus("Gespeicherte Rangliste wird geladen...");

            const { data, error } = await supabaseClient
                .from(RANKING_SNAPSHOT_TABLE)
                .select("season,discipline_id,discipline_label,payload,loaded_tournament_count,failed_count,updated_at,updated_by_name")
                .eq("season", lastSeason)
                .order("updated_at", { ascending: false })
                .limit(1);

            if (error) throw error;
            const snapshot = Array.isArray(data) ? data[0] : null;
            if (!snapshot) {
                document.getElementById("resultsWrap").innerHTML = `<div class="empty-state">Für die letzte abgeschlossene Saison ${escapeHtml(lastSeason)} ist noch keine gespeicherte Rangliste vorhanden.</div>`;
                setStatus(canRefreshRankings ? "Disziplin auswählen und mit Aktualisieren einmal zentral laden." : "Noch nicht zentral geladen.");
                return null;
            }

            setSelectValue("disciplineSelect", snapshot.discipline_id);
            renderRankingSnapshot(snapshot);
            return snapshot;
        }

        function renderRankingSnapshot(snapshot) {
            const wrap = document.getElementById("resultsWrap");
            if (!wrap) return;
            setSelectValue("seasonInput", snapshot?.season || "");
            setSelectValue("disciplineSelect", snapshot?.discipline_id || "");
            wrap.innerHTML = snapshot?.payload?.html || '<div class="empty-state">Gespeicherte Rangliste enthält keine Ausgabe.</div>';
            enhanceRankingTables(wrap);

            const loadedCount = Number(snapshot?.loaded_tournament_count || 0);
            const failedCount = Number(snapshot?.failed_count || 0);
            const updatedAt = formatDateTime(snapshot?.updated_at);
            const updatedBy = snapshot?.updated_by_name ? ` von ${snapshot.updated_by_name}` : "";
            const suffix = updatedAt ? ` Stand: ${updatedAt}${updatedBy}.` : "";
            setStatus(failedCount
                ? `${loadedCount} Turniere aus gespeicherter Rangliste, ${failedCount} übersprungen.${suffix}`
                : `${loadedCount} Turniere aus gespeicherter Rangliste geladen.${suffix}`);
        }

        function escapeExcelXml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function buildExcelCell(value, styleId = "") {
            const style = styleId ? ` ss:StyleID="${styleId}"` : "";
            return `<Cell${style}><Data ss:Type="String">${escapeExcelXml(value)}</Data></Cell>`;
        }

        function buildExcelRow(values, styleId = "") {
            return `<Row>${values.map((value) => buildExcelCell(value, styleId)).join("")}</Row>`;
        }

        function sanitizeExcelSheetName(value, fallback = "Rangliste") {
            const cleaned = String(value || fallback)
                .replace(/[\[\]:*?/\\]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
            return (cleaned || fallback).slice(0, 31);
        }

        function getRankingWorkbookFilename(season) {
            const seasonPart = String(season || getLastCompletedSeason())
                .replace(/[^\d]+/g, "-")
                .replace(/^-|-$/g, "");
            return `NBV-Ranglisten-${seasonPart}.xls`;
        }

        function extractSnapshotRankingRows(snapshot) {
            const html = String(snapshot?.payload?.html || "");
            if (!html) return [];
            const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
            const table = doc.querySelector(".season-block .ranking-table");
            if (!table) return [];

            return Array.from(table.rows).map((row) => (
                Array.from(row.cells).map((cell) => String(cell.textContent || "").replace(/\s+/g, " ").trim())
            ));
        }

        function buildRankingWorksheet(snapshot) {
            const rows = extractSnapshotRankingRows(snapshot);
            const disciplineLabel = snapshot?.discipline_label || NBV_DISCIPLINES[String(snapshot?.discipline_id || "")] || "Rangliste";
            const exportedAt = new Date().toLocaleString("de-DE");
            const updatedAt = formatDateTime(snapshot?.updated_at);

            const tableRows = [
                buildExcelRow([`NBV Rangliste - ${disciplineLabel}`], "Title"),
                buildExcelRow([`Saison: ${snapshot?.season || ""}`]),
                buildExcelRow([`Stand: ${updatedAt || "-"}`]),
                buildExcelRow([`Exportiert am: ${exportedAt}`]),
                "<Row></Row>",
                ...rows.map((row, index) => buildExcelRow(row, index === 0 ? "Header" : "")),
            ].join("");

            const columnCount = rows.reduce((max, row) => Math.max(max, row.length), 1);
            const columns = Array.from({ length: columnCount }, (_entry, index) => {
                const width = index === 1 ? 180 : index === 2 ? 90 : 76;
                return `<Column ss:Width="${width}"/>`;
            }).join("");

            return `
 <Worksheet ss:Name="${escapeExcelXml(sanitizeExcelSheetName(disciplineLabel))}">
  <Table>
   ${columns}
   ${tableRows}
  </Table>
 </Worksheet>`;
        }

        function downloadTextFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        }

        async function exportRankingWorkbook() {
            const season = getSelectedSeason() || getLastCompletedSeason();
            setStatus("Excel-Export wird vorbereitet...");

            try {
                const { data, error } = await supabaseClient
                    .from(RANKING_SNAPSHOT_TABLE)
                    .select("season,discipline_id,discipline_label,payload,loaded_tournament_count,failed_count,updated_at,updated_by_name")
                    .eq("season", season)
                    .in("discipline_id", RANKING_EXPORT_DISCIPLINE_IDS);

                if (error) throw error;

                const snapshotByDiscipline = new Map((data || []).map((snapshot) => [String(snapshot.discipline_id), snapshot]));
                const snapshots = RANKING_EXPORT_DISCIPLINE_IDS
                    .map((disciplineId) => snapshotByDiscipline.get(disciplineId))
                    .filter((snapshot) => snapshot && extractSnapshotRankingRows(snapshot).length > 1);

                if (!snapshots.length) {
                    setStatus(`Für ${season} sind noch keine exportierbaren Ranglisten gespeichert.`);
                    return;
                }

                const workbookXml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">
 <Styles>
  <Style ss:ID="Title"><Font ss:Bold="1" ss:Size="14"/><Alignment ss:Vertical="Center"/></Style>
  <Style ss:ID="Header"><Font ss:Bold="1"/><Interior ss:Color="#D5DADF" ss:Pattern="Solid"/></Style>
 </Styles>
 ${snapshots.map((snapshot) => buildRankingWorksheet(snapshot)).join("")}
</Workbook>`;

                downloadTextFile(workbookXml, getRankingWorkbookFilename(season), "application/vnd.ms-excel;charset=utf-8");

                const missingLabels = RANKING_EXPORT_DISCIPLINE_IDS
                    .filter((disciplineId) => !snapshotByDiscipline.has(disciplineId))
                    .map((disciplineId) => NBV_DISCIPLINES[disciplineId])
                    .filter(Boolean);
                setStatus(missingLabels.length
                    ? `${snapshots.length} Ranglisten exportiert. Noch nicht gespeichert: ${missingLabels.join(", ")}.`
                    : `${snapshots.length} Ranglisten exportiert.`);
            } catch (error) {
                const message = await getFunctionErrorMessage(error);
                setStatus(`Excel-Export fehlgeschlagen: ${message}`);
            }
        }

        async function saveRankingSnapshot(season, disciplineId, disciplineLabel, seasonBundles, failed, html) {
            const loadedTournamentCount = getLoadedTournamentCount(seasonBundles);
            const payload = {
                html,
                season,
                disciplineId,
                disciplineLabel,
                generatedAt: new Date().toISOString(),
            };
            const row = {
                id: `${season}-${disciplineId}`,
                season,
                discipline_id: disciplineId,
                discipline_label: disciplineLabel,
                payload,
                loaded_tournament_count: loadedTournamentCount,
                failed_count: Array.isArray(failed) ? failed.length : 0,
                failed_messages: Array.isArray(failed) ? failed.slice(0, 100) : [],
                updated_by: currentUser?.id || null,
                updated_by_name: getDisplayName(currentUser),
                updated_at: new Date().toISOString(),
            };

            const { error } = await supabaseClient
                .from(RANKING_SNAPSHOT_TABLE)
                .upsert(row, { onConflict: "id" });
            if (error) throw error;
        }

        async function loadBtdReference(season, disciplineId) {
            const { data, error } = await supabaseClient.functions.invoke("get-nbv-ranking-list", {
                body: {
                    season,
                    disciplineId,
                    type: "btd",
                },
            });
            if (error) throw error;

            const byPlayer = new Map();
            (Array.isArray(data?.entries) ? data.entries : []).forEach((entry) => {
                const key = normalizePlayerLookupKey(entry?.name);
                const valueNumber = Number(entry?.valueNumber);
                if (!key || !Number.isFinite(valueNumber)) return;
                byPlayer.set(key, {
                    ...entry,
                    valueNumber,
                });
            });

            return {
                season: data?.season || season,
                disciplineId: String(data?.disciplineId || disciplineId),
                sourceUrl: data?.sourceUrl || "",
                byPlayer,
            };
        }

        async function loadTournamentBatch(events, season, disciplineLabel, concurrency = 6) {
            const tournaments = new Array(events.length);
            const failed = [];
            let nextIndex = 0;
            let completed = 0;
            const total = events.length;

            async function worker() {
                while (nextIndex < total) {
                    const index = nextIndex;
                    nextIndex += 1;
                    const event = events[index];
                    try {
                        const tournament = await loadSingleTournament(String(event.link || "").trim(), false);
                        if (tournament) tournaments[index] = tournament;
                    } catch (error) {
                        failed.push(`${season} · ${event.title || event.link}: ${error instanceof Error ? error.message : String(error)}`);
                    } finally {
                        completed += 1;
                        setStatus(`Lade ${disciplineLabel} ${season}: ${completed} von ${total} Turnieren`);
                    }
                }
            }

            const workerCount = Math.min(concurrency, total);
            await Promise.all(Array.from({ length: workerCount }, () => worker()));

            return { tournaments: tournaments.filter(Boolean), failed };
        }

        async function loadSeasonTournamentBundle(season, disciplineId, disciplineLabel, todayIso) {
            const { data, error } = await supabaseClient.functions.invoke("get-nbv-calendar", {
                body: {
                    season,
                    disciplineId,
                    disciplineLabel,
                },
            });
            if (error) throw error;

            const events = Array.isArray(data?.events) ? data.events : [];
            const candidateEvents = events.filter((event) => String(event?.date || "") <= todayIso);
            const { tournaments, failed } = await loadTournamentBatch(candidateEvents, season, disciplineLabel);

            return { season, tournaments, failed };
        }

        async function loadSingleTournament(sourceUrl, forceRefresh = false) {
            try {
                const { data, error } = await supabaseClient.functions.invoke("get-nbv-tournament-results", {
                    body: {
                        sourceUrl,
                        forceRefresh: Boolean(forceRefresh),
                    },
                });
                if (error) throw error;

                return data || null;
            } catch (error) {
                console.warn("NBV-Turnierdaten konnten nicht geladen werden:", error);
                throw new Error(await getFunctionErrorMessage(error));
            }
        }

        function handleSnapshotLoadError(error) {
            console.warn("Gespeicherte Rangliste konnte nicht geladen werden:", error);
            document.getElementById("resultsWrap").innerHTML = `<div class="empty-state">Gespeicherte Rangliste konnte nicht geladen werden.<br>${escapeHtml(error?.message || error)}</div>`;
            setStatus("");
        }

        async function refreshSeasonRanking() {
            if (!canRefreshRankings) {
                setStatus("Keine Berechtigung zum Aktualisieren.");
                return;
            }

            const season = getSelectedSeason();
            const disciplineId = getSelectedDisciplineId();
            const disciplineLabel = getSelectedDisciplineLabel();
            if (!season || !disciplineId) return;

            try {
                const seasons = buildSeasonHistory(season, 3);
                const todayIso = new Date().toISOString().slice(0, 10);
                const seasonBundles = [];
                const failed = [];

                for (let index = 0; index < seasons.length; index += 1) {
                    const currentSeason = seasons[index];
                    setStatus(`Lade Saison ${index + 1} von ${seasons.length}: ${disciplineLabel} ${currentSeason}`);
                    try {
                        const bundle = await loadSeasonTournamentBundle(currentSeason, disciplineId, disciplineLabel, todayIso);
                        seasonBundles.push({
                            season: currentSeason,
                            tournaments: bundle.tournaments,
                        });
                        failed.push(...bundle.failed);
                    } catch (error) {
                        failed.push(`${currentSeason}: ${error instanceof Error ? error.message : String(error)}`);
                    }
                }

                const loadedTournamentCount = getLoadedTournamentCount(seasonBundles);

                if (!loadedTournamentCount) {
                    document.getElementById("resultsWrap").innerHTML = `<div class="empty-state">Keine Turniere konnten geladen werden.<br>${escapeHtml(failed[0] || "Unbekannter Fehler")}</div>`;
                    setStatus("");
                    return;
                }

                try {
                    setStatus(`Lade NDBV-BTD-Referenz: ${disciplineLabel} ${season}`);
                    activeBtdReference = await loadBtdReference(season, disciplineId);
                } catch (error) {
                    activeBtdReference = null;
                    failed.push(`NDBV-BTD-Referenz ${season}: ${error instanceof Error ? error.message : String(error)}`);
                }

                const html = renderSeasonResults(seasonBundles, failed);
                await saveRankingSnapshot(season, disciplineId, disciplineLabel, seasonBundles, failed, html);
                setStatus(failed.length
                    ? `${loadedTournamentCount} Turniere aus ${seasonBundles.length} Saisons geladen und gespeichert, ${failed.length} übersprungen.`
                    : `${loadedTournamentCount} Turniere aus ${seasonBundles.length} Saisons geladen und gespeichert.`);
            } catch (error) {
                const message = await getFunctionErrorMessage(error);
                document.getElementById("resultsWrap").innerHTML = `<div class="empty-state">Die Saison konnte nicht aktualisiert werden.<br>${escapeHtml(message)}</div>`;
                setStatus("");
            }
        }

        async function initPage() {
            try {
                currentUser = await requireAuth();
                if (!currentUser) return;
                const calendarAccess = await getCalendarAccess(currentUser);
                canRefreshRankings = isCalendarEditable(calendarAccess);
                applyRankingAccessUi();
                await loadLatestSeasonSnapshot();
            } finally {
                document.body.classList.add("page-ready");
            }
        }

        initPage().catch((error) => {
            console.error("NBV Ranglisten konnten nicht initialisiert werden:", error);
            document.body.classList.add("page-ready");
        });
    </script>
