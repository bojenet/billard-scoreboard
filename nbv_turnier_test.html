<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NBV Turnier-Test</title>
    <style>
        :root {
            --bg: #f2efe7;
            --panel: #ffffff;
            --line: #cfd5dc;
            --text: #19202a;
            --muted: #647083;
            --head: #122033;
            --blue: #2d5880;
            --blue-deep: #214564;
            --soft: #f8f8f4;
            --ok: #157347;
            --error: #b42318;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        body {
            visibility: hidden;
        }

        body.page-ready {
            visibility: visible;
        }

        .page {
            width: min(1600px, 98%);
            margin: 0 auto;
            padding: 16px 0 32px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            padding: 12px;
        }

        .matches-list {
            display: grid;
            gap: 14px;
        }

        .tournament-meta {
            display: grid;
            gap: 6px;
            margin-bottom: 14px;
            padding: 2px 2px 6px;
        }

        .tournament-meta-row {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 10px;
            align-items: start;
            font-size: 14px;
            line-height: 1.4;
        }

        .tournament-meta-label {
            font-weight: 700;
            color: var(--muted);
        }

        .tournament-meta-value {
            color: var(--text);
        }

        .match-card {
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
        }

        .match-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #eef3f8;
            border-bottom: 1px solid #d8dee6;
        }

        .match-card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--head);
        }

        .match-card-sub {
            font-size: 12px;
            color: var(--muted);
            text-align: right;
        }

        .match-table-wrap {
            overflow-x: auto;
        }

        .match-table {
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
        }

        .match-table th,
        .match-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #d8dee6;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        .match-table th {
            background: #f8fafc;
            color: #344256;
            font-weight: 700;
            font-size: 12px;
        }

        .match-table tbody tr:last-child td {
            border-bottom: none;
        }

        .match-player-cell {
            font-weight: 700;
            color: var(--head);
            min-width: 210px;
        }

        .match-num-cell {
            width: 80px;
            white-space: nowrap;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .details-line {
            padding: 9px 12px 11px;
            border-top: 1px solid #e7ebf0;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        .empty-state {
            border: 1px dashed #c5cfda;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.75);
            color: #59677a;
            padding: 18px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .page {
                width: min(96%, 96%);
            }

            .panel {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="panel">
            <div id="resultsWrap">
                <div class="empty-state">Noch kein Turnier geladen.</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/user_menu.js"></script>
    <script>
        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleDateString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
            });
        }

        function buildDetails(details) {
            const list = Array.isArray(details) ? details.filter((entry) => entry && entry.value) : [];
            if (!list.length) return "";
            return list.map((entry) => `${escapeHtml(entry.label)}: ${escapeHtml(entry.value)}`).join(" · ");
        }

        function buildMetaBlock(meta) {
            const rows = [
                { label: "Turnier", value: meta?.title || "-" },
                { label: "Kürzel", value: meta?.shortCode || "-" },
                { label: "Datum", value: meta?.date ? formatDate(meta.date) : "-" },
                { label: "Spielbeginn", value: meta?.startTime ? `${formatDate(meta.date)} um ${meta.startTime} Uhr` : "-" },
                { label: "Location", value: meta?.location || "-" },
            ];

            return `
                <section class="tournament-meta">
                    ${rows.map((row) => `
                        <div class="tournament-meta-row">
                            <div class="tournament-meta-label">${escapeHtml(row.label)}</div>
                            <div class="tournament-meta-value">${escapeHtml(row.value)}</div>
                        </div>
                    `).join("")}
                </section>
            `;
        }

        function buildMatchCard(row) {
            const title = row.groupLabel
                ? `${row.groupLabel} · Partie ${row.matchNo || "-"} · ${row.score || "-"}`
                : `Partie ${row.matchNo || "-"} · ${row.score || "-"}`;
            const plan = [formatDate(row.scheduledDate), row.scheduledTime || ""].filter((value) => value && value !== "-").join(" · ");
            return `
                <section class="match-card">
                    <div class="match-card-head">
                        <div class="match-card-title">${escapeHtml(title)}</div>
                        <div class="match-card-sub">${escapeHtml(plan || "-")}</div>
                    </div>
                    <div class="match-table-wrap">
                        <table class="match-table">
                            <thead>
                                <tr>
                                    <th>Spieler</th>
                                    <th>Bälle</th>
                                    <th>Aufn.</th>
                                    <th>Ø</th>
                                    <th>HS</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="match-player-cell">${escapeHtml(row.player1?.name || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.balls || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.innings || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.average || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.hs || "-")}</td>
                                </tr>
                                <tr>
                                    <td class="match-player-cell">${escapeHtml(row.player2?.name || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.balls || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.innings || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.average || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.hs || "-")}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    ${buildDetails(row.details) ? `<div class="details-line">${buildDetails(row.details)}</div>` : ""}
                </section>
            `;
        }

        function renderResults(data) {
            const wrap = document.getElementById("resultsWrap");
            const rows = Array.isArray(data?.matches) ? data.matches : [];
            if (!wrap) return;

            if (!rows.length) {
                wrap.innerHTML = '<div class="empty-state">Keine Begegnungen gefunden.</div>';
                return;
            }

            wrap.innerHTML = `
                ${buildMetaBlock(data?.meta || {})}
                <div class="matches-list">
                    ${rows.map((row) => buildMatchCard(row)).join("")}
                </div>
            `;
        }

        async function loadTournament(forceRefresh = false) {
            try {
                const { data, error } = await supabaseClient.functions.invoke("get-nbv-tournament-results", {
                    body: {
                        sourceUrl: "https://www.ndbv.de/sb_meisterschaft.php?p=20-10-2025/2026-882---2-4-10--",
                        forceRefresh: Boolean(forceRefresh),
                    },
                });
                if (error) throw error;

                renderResults(data || {});
            } catch (error) {
                console.warn("NBV-Turnierdaten konnten nicht geladen werden:", error);
                document.getElementById("resultsWrap").innerHTML = '<div class="empty-state">Der Turnierabruf ist aktuell nicht verfügbar.</div>';
            }
        }

        async function initPage() {
            try {
                const user = await requireAuth();
                if (!user) return;
                await loadTournament(false);
            } finally {
                document.body.classList.add("page-ready");
            }
        }

        initPage().catch((error) => {
            console.error("NBV Turnier-Test konnte nicht initialisiert werden:", error);
            document.body.classList.add("page-ready");
        });
    </script>
</body>
</html>
