<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NBV Turnier-Test</title>
    <style>
        :root {
            --bg: #f2efe7;
            --panel: #ffffff;
            --line: #cfd5dc;
            --text: #19202a;
            --muted: #647083;
            --head: #122033;
            --blue: #2d5880;
            --blue-deep: #214564;
            --soft: #f8f8f4;
            --ok: #157347;
            --error: #b42318;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        body {
            visibility: hidden;
        }

        body.page-ready {
            visibility: visible;
        }

        .header {
            text-align: center;
            padding: 28px 16px 14px;
        }

        .header h1 {
            margin: 0;
            font-size: 38px;
            line-height: 1.15;
            color: var(--head);
        }

        .header p {
            margin: 10px auto 0;
            max-width: 900px;
            font-size: 16px;
            line-height: 1.45;
            color: var(--muted);
        }

        .page {
            width: min(1400px, 96%);
            margin: 0 auto;
            padding-bottom: 32px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            padding: 16px 18px;
            margin-bottom: 14px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 10px;
            align-items: end;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.35px;
            color: #475467;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #bcc6d2;
            border-radius: 4px;
            padding: 11px 12px;
            font-size: 14px;
            background: #fff;
            color: #10131c;
        }

        .btn {
            min-height: 44px;
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--blue);
            border-color: var(--blue-deep);
            color: #fff;
        }

        .btn-secondary {
            background: #fff;
            border-color: #c3ccd6;
            color: #35506b;
        }

        .meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #fff;
            color: #435162;
            font-size: 13px;
            font-weight: 700;
        }

        .message {
            min-height: 20px;
            margin-top: 12px;
            font-size: 13px;
        }

        .message.ok {
            color: var(--ok);
        }

        .message.error {
            color: var(--error);
        }

        .loading-wrap {
            display: none;
            gap: 8px;
            margin-top: 12px;
        }

        .loading-wrap.active {
            display: grid;
        }

        .loading-text {
            font-size: 13px;
            color: var(--muted);
        }

        .loading-bar {
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: #e5e7eb;
            position: relative;
        }

        .loading-bar::before {
            content: "";
            position: absolute;
            inset: 0;
            width: 34%;
            border-radius: inherit;
            background: linear-gradient(90deg, #9ab6cf 0%, #2d5880 50%, #9ab6cf 100%);
            animation: loading-slide 1.2s ease-in-out infinite;
        }

        @keyframes loading-slide {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(280%); }
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .meta-card {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 4px;
            padding: 10px 12px;
        }

        .meta-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .meta-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.35;
            word-break: break-word;
        }

        .matches-list {
            display: grid;
            gap: 14px;
        }

        .match-card {
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
        }

        .match-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #eef3f8;
            border-bottom: 1px solid #d8dee6;
        }

        .match-card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--head);
        }

        .match-card-sub {
            font-size: 12px;
            color: var(--muted);
            text-align: right;
        }

        .match-table-wrap {
            overflow-x: auto;
        }

        .match-table {
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
        }

        .match-table th,
        .match-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #d8dee6;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        .match-table th {
            background: #f8fafc;
            color: #344256;
            font-weight: 700;
            font-size: 12px;
        }

        .match-table tbody tr:last-child td {
            border-bottom: none;
        }

        .match-player-cell {
            font-weight: 700;
            color: var(--head);
            min-width: 210px;
        }

        .match-num-cell {
            width: 80px;
            white-space: nowrap;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .details-line {
            padding: 9px 12px 11px;
            border-top: 1px solid #e7ebf0;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        .empty-state {
            border: 1px dashed #c5cfda;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.75);
            color: #59677a;
            padding: 18px;
            text-align: center;
        }

        @media (max-width: 980px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .meta-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 30px;
            }

            .page {
                width: min(96%, 96%);
            }

            .panel {
                padding: 14px;
            }

            .meta-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NBV Turnier-Test</h1>
        <p>Einzelne fertige NBV-Turnierseiten laden und prüfen, welche Ergebnisdaten für die spätere Rangliste sauber auslesbar sind.</p>
    </div>

    <div class="page">
        <div class="panel">
            <div class="toolbar">
                <div class="field">
                    <label for="sourceUrlInput">NBV Turnier-URL</label>
                    <input
                        id="sourceUrlInput"
                        type="url"
                        value="https://www.ndbv.de/sb_meisterschaft.php?p=20-10-2025/2026-882---2-4-10--"
                        placeholder="https://www.ndbv.de/sb_meisterschaft.php?p=20-10-2025/2026-882---2-4-10--"
                    >
                </div>
                <button id="loadBtn" class="btn btn-primary" type="button" onclick="loadTournament(false)">Turnier laden</button>
                <button id="refreshBtn" class="btn btn-secondary" type="button" onclick="loadTournament(true)">Neu laden</button>
            </div>

            <div id="loadingWrap" class="loading-wrap">
                <div class="loading-text">NBV-Turnier wird geladen...</div>
                <div class="loading-bar"></div>
            </div>

            <div id="message" class="message"></div>
        </div>

        <div class="panel">
            <div class="meta">
                <div id="fetchedBadge" class="badge">Stand: noch nicht geladen</div>
                <div id="sourceBadge" class="badge">Quelle: NBV</div>
                <div id="countBadge" class="badge">0 Partien</div>
            </div>

            <div id="metaGrid" class="meta-grid">
                <div class="meta-card">
                    <div class="meta-label">Turnier</div>
                    <div id="metaTitle" class="meta-value">-</div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Saison</div>
                    <div id="metaSeason" class="meta-value">-</div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Datum</div>
                    <div id="metaDate" class="meta-value">-</div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Disziplin</div>
                    <div id="metaDiscipline" class="meta-value">-</div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Ort</div>
                    <div id="metaLocation" class="meta-value">-</div>
                </div>
            </div>

            <div id="resultsWrap">
                <div class="empty-state">Noch kein Turnier geladen.</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/user_menu.js"></script>
    <script>
        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function setLoadingState(isLoading) {
            const wrap = document.getElementById("loadingWrap");
            const loadBtn = document.getElementById("loadBtn");
            const refreshBtn = document.getElementById("refreshBtn");
            if (wrap) wrap.classList.toggle("active", Boolean(isLoading));
            if (loadBtn) {
                loadBtn.disabled = Boolean(isLoading);
                loadBtn.innerText = isLoading ? "Lädt..." : "Turnier laden";
            }
            if (refreshBtn) {
                refreshBtn.disabled = Boolean(isLoading);
            }
        }

        function setMessage(text, type) {
            const el = document.getElementById("message");
            if (!el) return;
            el.className = "message " + (type || "");
            el.innerText = text || "";
        }

        function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleDateString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
            });
        }

        function formatTimestamp(value) {
            if (!value) return "unbekannt";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "unbekannt";
            return date.toLocaleString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
            });
        }

        async function getFunctionErrorMessage(error) {
            if (!error) return "Unbekannter Fehler";
            if (error.message && !/non-2xx status code/i.test(String(error.message))) {
                return String(error.message);
            }
            const context = error.context;
            if (context && typeof context.text === "function") {
                try {
                    const raw = await context.text();
                    if (raw) {
                        try {
                            const parsed = JSON.parse(raw);
                            return parsed?.message || parsed?.error || raw;
                        } catch (_) {
                            return raw;
                        }
                    }
                } catch (_) {
                    return String(error.message || "Unbekannter Fehler");
                }
            }
            return String(error.message || "Unbekannter Fehler");
        }

        function updateMeta(data) {
            document.getElementById("fetchedBadge").innerText = `Stand: ${formatTimestamp(data?.fetchedAt)}`;
            document.getElementById("sourceBadge").innerText = data?.resultsUrl
                ? `Ergebnisse: ${data.resultsUrl}`
                : "Quelle: NBV";
            const count = Array.isArray(data?.matches) ? data.matches.length : 0;
            document.getElementById("countBadge").innerText = `${count} Partien`;

            const meta = data?.meta || {};
            document.getElementById("metaTitle").innerText = meta.title || "-";
            document.getElementById("metaSeason").innerText = meta.season || "-";
            document.getElementById("metaDate").innerText = formatDate(meta.date);
            document.getElementById("metaDiscipline").innerText = meta.discipline || "-";
            document.getElementById("metaLocation").innerText = meta.location || "-";
        }

        function buildDetails(details) {
            const list = Array.isArray(details) ? details.filter((entry) => entry && entry.value) : [];
            if (!list.length) return "-";
            return list.map((entry) => `${escapeHtml(entry.label)}: ${escapeHtml(entry.value)}`).join(" · ");
        }

        function buildMatchCard(row) {
            const title = row.groupLabel
                ? `${row.groupLabel} · Partie ${row.matchNo || "-"} · ${row.score || "-"}`
                : `Partie ${row.matchNo || "-"} · ${row.score || "-"}`;
            const plan = [formatDate(row.scheduledDate), row.scheduledTime || ""].filter((value) => value && value !== "-").join(" · ");
            return `
                <section class="match-card">
                    <div class="match-card-head">
                        <div class="match-card-title">${escapeHtml(title)}</div>
                        <div class="match-card-sub">${escapeHtml(plan || "-")}</div>
                    </div>
                    <div class="match-table-wrap">
                        <table class="match-table">
                            <thead>
                                <tr>
                                    <th>Spieler</th>
                                    <th>Bälle</th>
                                    <th>Aufn.</th>
                                    <th>Ø</th>
                                    <th>HS</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="match-player-cell">${escapeHtml(row.player1?.name || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.balls || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.innings || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.average || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player1?.hs || "-")}</td>
                                </tr>
                                <tr>
                                    <td class="match-player-cell">${escapeHtml(row.player2?.name || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.balls || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.innings || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.average || "-")}</td>
                                    <td class="match-num-cell">${escapeHtml(row.player2?.hs || "-")}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="details-line">${buildDetails(row.details)}</div>
                </section>
            `;
        }

        function renderResults(data) {
            const wrap = document.getElementById("resultsWrap");
            const rows = Array.isArray(data?.matches) ? data.matches : [];
            if (!wrap) return;

            if (!rows.length) {
                wrap.innerHTML = '<div class="empty-state">Keine Begegnungen gefunden.</div>';
                return;
            }

            wrap.innerHTML = `
                <div class="matches-list">
                    ${rows.map((row) => buildMatchCard(row)).join("")}
                </div>
            `;
        }

        async function loadTournament(forceRefresh = false) {
            const sourceUrl = String(document.getElementById("sourceUrlInput")?.value || "").trim();
            if (!sourceUrl) {
                setMessage("Bitte zuerst eine NBV-Turnier-URL eingeben.", "error");
                return;
            }

            setLoadingState(true);
            setMessage("", "");

            try {
                const { data, error } = await supabaseClient.functions.invoke("get-nbv-tournament-results", {
                    body: {
                        sourceUrl,
                        forceRefresh: Boolean(forceRefresh),
                    },
                });
                if (error) throw error;

                updateMeta(data || {});
                renderResults(data || {});
                setMessage("Turnierdaten wurden geladen.", "ok");
            } catch (error) {
                console.warn("NBV-Turnierdaten konnten nicht geladen werden:", error);
                const errorMessage = await getFunctionErrorMessage(error);
                setMessage(`NBV-Turnierdaten konnten nicht geladen werden: ${errorMessage}`, "error");
                document.getElementById("resultsWrap").innerHTML = '<div class="empty-state">Der Turnierabruf ist aktuell nicht verfügbar.</div>';
            } finally {
                setLoadingState(false);
            }
        }

        async function initPage() {
            try {
                const user = await requireAuth();
                if (!user) return;
            } finally {
                document.body.classList.add("page-ready");
            }
        }

        initPage().catch((error) => {
            console.error("NBV Turnier-Test konnte nicht initialisiert werden:", error);
            document.body.classList.add("page-ready");
        });
    </script>
</body>
</html>
